<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e2a33">
<meta name="apple-mobile-web-app-title" content="Hardin Games">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Hardin Games</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#170c2e;--bg2:#24124a;--card:#2f1a5e;--card2:#3b2275;--gold:#ffd23f;--pink:#ff4f8b;--teal:#2de2c8;--text:#fff7ea;--muted:#c3b4ea;--bad:#ff6b6b;--good:#5ef08a;
  --glow:#4a2496;--line:#4b3290;--line2:#5a3aa8;--field:#1c0f3a;--btn:#ffd23f;--btnText:#2a1700;--btnShadow:#b88d00;--altShadow:#1d0f3d;--accentShadow:#a8204f;
  --logo1:#ffd23f;--logo2:#2de2c8;--logo2s:#1b6e63;--logo1Shadow:0 4px 0 #a8204f,0 0 30px #ff4f8b66;--logo2Shadow:0 4px 0 #1b6e63;--logoGlow:#ff4f8b66;--optLine:#6a48c0;
  --overlay:#120826ee;--overlay2:#120826cc;--t1:#ffffff0e;--t2:#ffffff13;--t3:#ffffff18;--t4:#ffffff2e;--shade:#00000055;--shade2:#00000088;
  --tv1:#5a2aa8;--tv2:#1d0f3d;--tv3:#120826;--coverMid:#5a1a6e;--deep:#120826;--gmFibs:#ff4f8b;--gmTrivia:#2de2c8;--gmDoodle:#ffd23f;--gmMic:#a58bff}
html[data-theme=sunset]{--bg:#0e2a33;--bg2:#0b2229;--card:#133640;--card2:#1d4a57;--gold:#ffc857;--pink:#ff6f59;--teal:#4fd1c5;--text:#fdf6ec;--muted:#9cc1c4;--bad:#ff8a7a;--good:#6ee7a8;
  --glow:#1f5f6b;--line:#1f5361;--line2:#24606f;--field:#0b2229;--btn:#ff6f59;--btnText:#ffffff;--btnShadow:#c24434;--altShadow:#0b2229;--accentShadow:#b8402e;
  --logo1:#ffc857;--logo2:#ff6f59;--logo2s:#7a2a1f;--logo1Shadow:0 4px 0 #c0392b,0 0 30px #ff6f5944;--logo2Shadow:0 4px 0 #7a2a1f;--logoGlow:#ff6f5944;--optLine:#2a6574;
  --overlay:#081c22ee;--overlay2:#081c22cc;--tv1:#1f5f6b;--tv2:#0e2a33;--tv3:#081c22;--coverMid:#7a3b52;--deep:#081c22;--gmFibs:#ff6f59;--gmTrivia:#ffc857;--gmDoodle:#4fd1c5;--gmMic:#ff8fab}
html[data-theme=arcade]{--bg:#0b0d12;--bg2:#10141b;--card:#141a23;--card2:#222c39;--gold:#b6ff3b;--pink:#ff3bd4;--teal:#3be8ff;--text:#f2f5f7;--muted:#8a97a6;--bad:#ff5d73;--good:#5ef08a;
  --glow:#13202e;--line:#263241;--line2:#2c3a4c;--field:#0e131a;--btn:#b6ff3b;--btnText:#0b0d12;--btnShadow:#6fa51f;--altShadow:#0f141b;--accentShadow:#7a1466;
  --logo1:#3be8ff;--logo2:#ff3bd4;--logo2s:#7a1466;--logo1Shadow:0 0 18px #3be8ffaa,0 3px 0 #0b6b78;--logo2Shadow:0 0 18px #ff3bd4aa,0 3px 0 #7a1466;--logoGlow:#3be8ff66;--optLine:#33415a;
  --overlay:#0b0d12ee;--overlay2:#0b0d12cc;--tv1:#1a2433;--tv2:#0b0d12;--tv3:#07090c;--coverMid:#4a1550;--deep:#07090c;--gmFibs:#ff3bd4;--gmTrivia:#3be8ff;--gmDoodle:#b6ff3b;--gmMic:#ff9a3b}
html[data-theme=arcade] body{background:#0b0d12;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:32px 32px}
html[data-theme=gameshow]{--bg:#ffefd2;--bg2:#fff6e5;--card:#ffffff;--card2:#ffe7b0;--gold:#e63946;--pink:#e63946;--teal:#1d6fd6;--text:#2b1d12;--muted:#7a6553;--bad:#d62828;--good:#12a150;
  --glow:#fffdf6;--line:#2b1d12;--line2:#2b1d12;--field:#ffffff;--btn:#e63946;--btnText:#ffffff;--btnShadow:#9e1f2a;--altShadow:#c99a2e;--accentShadow:#2b1d12;
  --logo1:#e63946;--logo2:#1d6fd6;--logo2s:#2b1d12;--logo1Shadow:3px 3px 0 #2b1d12;--logo2Shadow:3px 3px 0 #2b1d12;--logoGlow:transparent;--optLine:#2b1d12;
  --overlay:#fff6e5ee;--overlay2:#fff6e5cc;--t1:#2b1d120c;--t2:#2b1d1211;--t3:#2b1d1218;--t4:#2b1d1230;--shade:#2b1d120f;--shade2:#2b1d1222;
  --tv1:#fffdf6;--tv2:#ffefd2;--tv3:#ffe2b3;--coverMid:#ff9f6b;--deep:#ffe2b3;--gmFibs:#e63946;--gmTrivia:#1d6fd6;--gmDoodle:#f08a24;--gmMic:#12a150}
html[data-theme=gameshow] .gamecard,html[data-theme=gameshow] .sec{border:3px solid #2b1d12;box-shadow:0 6px 0 #2b1d12}
html[data-theme=gameshow] .gamecard.soon{background:#fff8e8;border:3px dashed #c9b38f;box-shadow:none}
html[data-theme=gameshow] button.alt{background:#ffd166;box-shadow:0 4px 0 #c99a2e}
html[data-theme=gameshow] .tile,html[data-theme=gameshow] .brow,html[data-theme=gameshow] .opt,html[data-theme=gameshow] .topt,html[data-theme=gameshow] .catc,html[data-theme=gameshow] .award{box-shadow:0 0 0 2px #2b1d1222}
html[data-theme=gameshow] .cover .sub,html[data-theme=gameshow] .cover .big{color:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% -10%,var(--glow) 0%,var(--bg) 55%) fixed,var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;font-weight:800;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 20px;background:var(--btn);color:var(--btnText);font-weight:900;letter-spacing:.02em;box-shadow:0 4px 0 var(--btnShadow);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btnShadow)}
button.alt{background:var(--card2);color:var(--text);box-shadow:0 4px 0 var(--altShadow)}
button.pink{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--accentShadow)}
button:disabled{opacity:.45;pointer-events:none}
input,select,textarea{font:inherit;font-weight:800;width:100%;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--field);color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--teal)}
.logo{font-family:Bungee,sans-serif;line-height:.95;text-align:center;color:var(--logo1);text-shadow:var(--logo1Shadow)}
.logo span{display:block;color:var(--logo2);text-shadow:var(--logo2Shadow)}
.muted{color:var(--muted)}
.blank{display:inline-block;min-width:3.5em;border-bottom:.12em solid var(--gold);margin:0 .15em}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-family:Bungee;color:#1a0b33;flex:none}
/* landing */
.landing{max-width:440px;margin:0 auto;padding:40px 20px 30px;display:flex;flex-direction:column;gap:22px}
.landing .logo{font-size:52px}
.gamecard{background:var(--card);border-radius:22px;padding:22px;border:2px solid var(--line2);display:flex;flex-direction:column;gap:12px}
.gamecard h2{font-family:Bungee;font-size:34px;color:var(--pink)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.links{text-align:center;display:flex;gap:18px;justify-content:center}
.links a{color:var(--muted);text-decoration:underline;cursor:pointer}
.modeline{text-align:center;font-size:13px}
/* TV */
.tv{position:relative;container-type:inline-size;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,var(--tv1) 0%,var(--tv2) 60%,var(--tv3) 100%);color:var(--text)}
.tv.full{width:100vw;height:100vh;height:100dvh}
.tv.framed{width:100%;aspect-ratio:16/10;border-radius:16px;border:3px solid var(--line);box-shadow:0 10px 40px var(--shade2)}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;padding:3cqw 4cqw}
.tvtop{display:flex;justify-content:space-between;align-items:center;font-size:1.6cqw;color:var(--muted);letter-spacing:.1em}
.tvtop b{font-family:Bungee;color:var(--gold);letter-spacing:.05em}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2cqw;min-height:0}
.lobby{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:4cqw;align-items:center;min-height:0}
.lobby .logo{font-size:6cqw;text-align:left}
.gname{font-family:Bungee;font-size:3.4cqw;color:var(--gmFibs);margin-top:1cqw}
.codebox{background:var(--shade2);border-radius:2cqw;padding:2cqw;margin-top:2cqw;display:flex;gap:2cqw;align-items:center}
.codebox .lbl{font-size:1.5cqw;color:var(--muted)}
.code{font-family:Bungee;font-size:7cqw;color:var(--gold);letter-spacing:.08em;line-height:1}
.url{font-size:1.4cqw;color:var(--teal);word-break:break-all}
.qr{background:#fff;padding:.8cqw;border-radius:1cqw;width:12cqw;height:12cqw;flex:none}
.qr img,.qr canvas{width:100%!important;height:100%!important}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4cqw}
.tile{background:var(--t2);border-radius:1.4cqw;padding:1.2cqw .6cqw;display:flex;flex-direction:column;align-items:center;gap:.6cqw;font-size:1.5cqw;position:relative;min-width:0}
.tile .av{width:5cqw;height:5cqw;font-size:2.4cqw}
.tile.off{opacity:.35}
.tile .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .chk{position:absolute;top:-.6cqw;right:-.6cqw;background:var(--good);color:#063;border-radius:50%;width:2.4cqw;height:2.4cqw;font-size:1.4cqw;display:flex;align-items:center;justify-content:center}
.tile.empty{border:.2cqw dashed var(--t4);background:none;color:var(--t4);justify-content:center;min-height:9cqw}
.tvbtns{display:flex;gap:1.2cqw;justify-content:center}
.tvbtns button{font-size:1.6cqw;padding:1cqw 2.2cqw;border-radius:1.2cqw}
.note{font-size:1.5cqw;color:var(--muted)}
.question{font-size:3.6cqw;line-height:1.25;max-width:85cqw;font-weight:900}
.qsrc{font-size:1.4cqw;color:var(--teal);letter-spacing:.12em;text-transform:uppercase}
.timer{position:absolute;right:3cqw;bottom:3cqw;width:7cqw;height:7cqw;border-radius:50%;background:var(--pink);color:#fff;font-family:Bungee;font-size:3cqw;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 .5cqw color-mix(in srgb,var(--pink) 27%,transparent)}
.timer.low{animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.1)}}
.strip{display:flex;gap:1cqw;justify-content:center;flex-wrap:wrap}
.strip .tile{width:9cqw}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.4cqw;width:100%;max-width:88cqw}
.opt{background:var(--card2);border-radius:1.4cqw;padding:1.6cqw;font-size:2.4cqw;text-transform:uppercase;font-weight:900;border:.25cqw solid var(--optLine)}
.bigintro{font-family:Bungee;font-size:9cqw;color:var(--gold);text-shadow:0 .6cqw 0 var(--accentShadow);animation:pop .6s}
.subintro{font-size:2.6cqw;color:var(--teal)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.revcard{background:var(--card2);border-radius:2cqw;padding:2.5cqw 4cqw;font-size:4.4cqw;text-transform:uppercase;font-weight:900;border:.4cqw solid var(--optLine);animation:pop .45s;max-width:80cqw}
.revcard.truth{background:var(--good);color:#06301a;border-color:#fff}
.revlbl{font-family:Bungee;font-size:3cqw;animation:pop .5s .9s both}
.revlbl.lie{color:var(--pink)}.revlbl.house{color:var(--teal)}.revlbl.tr{color:var(--good)}
.pts{font-family:Bungee;color:var(--gold);font-size:2.2cqw;animation:pop .4s 1.3s both}
.board{width:100%;max-width:70cqw;display:flex;flex-direction:column;gap:1cqw}
.brow{display:flex;align-items:center;gap:1.4cqw;background:var(--t1);border-radius:1.2cqw;padding:.9cqw 1.4cqw;font-size:2.2cqw}
.brow .av{width:3.6cqw;height:3.6cqw;font-size:1.8cqw}
.brow .nm{flex:1;text-align:left}
.brow .sc{font-family:Bungee;color:var(--gold)}
.brow .dl{font-family:Bungee;color:var(--good);font-size:1.6cqw;min-width:8cqw;text-align:right}
.podium{display:flex;align-items:flex-end;gap:2cqw}
.pod{display:flex;flex-direction:column;align-items:center;gap:1cqw;font-size:2cqw}
.pod .av{width:7cqw;height:7cqw;font-size:3.4cqw}
.pod .blk{width:14cqw;border-radius:1cqw 1cqw 0 0;background:var(--card2);display:flex;align-items:flex-start;justify-content:center;padding-top:1cqw;font-family:Bungee;font-size:3.4cqw;color:var(--gold)}
.tap{position:absolute;inset:0;background:var(--overlay);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;z-index:5;cursor:pointer}
.tap .logo{font-size:7cqw}
.tap button{font-size:2.4cqw;padding:1.4cqw 3.4cqw}
.paused{position:absolute;inset:0;background:var(--overlay2);display:flex;align-items:center;justify-content:center;font-family:Bungee;font-size:6cqw;color:var(--gold);z-index:4}
.hostctl{position:absolute;left:3cqw;bottom:3cqw;display:flex;gap:1cqw;z-index:3}
.hostctl button{font-size:1.3cqw;padding:.8cqw 1.6cqw;border-radius:1cqw;opacity:.75}
/* phone */
.phone{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.phone.framed{border-radius:24px;border:3px solid var(--line);background:var(--bg);min-height:560px;overflow:hidden}
.phead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--shade)}
.phead .av{width:34px;height:34px;font-size:15px}
.phead .nm{flex:1}
.phead .sc{font-family:Bungee;color:var(--gold)}
.phead .snd{background:none;box-shadow:none;padding:4px 6px;font-size:18px;color:var(--text)}
.pbody{flex:1;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.pbody h3{font-family:Bungee;font-size:24px;color:var(--gold);font-weight:400}
.pq{font-size:19px;line-height:1.35}
.ptimer{font-family:Bungee;color:var(--pink);font-size:18px;text-align:right}
.pchoice{background:var(--card2);color:var(--text);box-shadow:0 4px 0 var(--altShadow);text-transform:uppercase;text-align:left;font-size:17px}
.pchoice.sel{background:var(--teal);color:#032;box-shadow:0 4px 0 #157}
.err{color:var(--bad);font-size:15px}
.ok{color:var(--good)}
.bigmsg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;font-size:20px}
.bigmsg .em{font-size:54px}
.vip{border-top:2px dashed var(--line);padding-top:14px;display:flex;gap:10px}
.vip button{flex:1;padding:11px;font-size:15px}
.small{font-size:13px}
.addq{background:var(--t1);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
/* demo */
.demo{display:grid;grid-template-columns:1fr 380px;gap:18px;padding:16px;max-width:1500px;margin:0 auto;align-items:start}
.demobar{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.demobar .logo{font-size:22px;text-align:left}
.demobar .sp{flex:1}
.demobar button{padding:9px 14px;font-size:14px}
.plabel{font-size:13px;color:var(--muted);margin:0 0 6px 4px;letter-spacing:.1em}
@media (max-width:900px){.demo{grid-template-columns:1fr;padding:10px}.tv.framed{aspect-ratio:4/3}}
/* admin */
.admin{max-width:640px;margin:0 auto;padding:24px 18px 60px;display:flex;flex-direction:column;gap:18px}
.admin .logo{font-size:30px}
.sec{background:var(--card);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.sec h3{font-family:Bungee;font-weight:400;color:var(--pink);font-size:20px}
.fld{display:flex;align-items:center;gap:12px;justify-content:space-between}
.fld>label{flex:1}
.fld input[type=number]{width:96px}
.fld select{width:auto;max-width:60%}
.fld input[type=checkbox]{width:24px;height:24px;accent-color:var(--teal)}
.fld input[type=range]{width:45%}
.qlist{display:flex;flex-direction:column;gap:8px}
.qitem{background:var(--t1);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:15px}
.qitem div{flex:1}
.qitem button{padding:6px 10px;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--teal);color:#032;padding:12px 20px;border-radius:12px;z-index:50}

/* v2: avatars, fx, reveal drama, awards, picker */
.av{overflow:hidden}
.av.ph{background-size:cover;background-position:center}
.av.em i{font-style:normal;font-size:1.3em;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.floater{position:absolute;bottom:-6cqw;font-size:5cqw;animation:floatUp 3s ease-out forwards}
@keyframes floatUp{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1;transform:translate(0,-8cqw) scale(1.15)}100%{transform:translate(var(--dx),-48cqw) scale(1);opacity:0}}
.conf{position:absolute;top:-3cqw;width:1.1cqw;height:1.7cqw;border-radius:.2cqw;animation:fall 2.7s ease-in both}
@keyframes fall{to{transform:translate(var(--dx),75cqw) rotate(var(--r))}}
.drum{font-family:Bungee;font-size:3.4cqw;color:var(--teal);animation:drum .1s 16 alternate}
@keyframes drum{to{transform:scale(1.05) rotate(-1deg)}}
.revcard.late1{animation:pop .45s 1.6s both}
.late2{display:flex;flex-direction:column;align-items:center;gap:1.2cqw;animation:pop .4s 2s both}
.late2 .revlbl{animation:none}
.cardwrap{position:relative}
.stamp{position:absolute;right:-6cqw;bottom:-2.2cqw;font-family:Bungee;font-size:2.8cqw;color:var(--pink);border:.4cqw solid var(--pink);border-radius:1cqw;padding:.2cqw 1.4cqw;transform:rotate(-12deg);background:var(--overlay);animation:stamp .3s 1.2s both;white-space:nowrap}
.stamp.house{color:var(--teal);border-color:var(--teal)}
@keyframes stamp{from{transform:rotate(-12deg) scale(3);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.quip{font-family:Bungee;color:var(--pink);font-size:2.3cqw}
.lq{font-size:1.9cqw;background:var(--t2);border-radius:1.2cqw;padding:1cqw 2cqw;max-width:75cqw}
.lq b{color:var(--good)}
.final{gap:1.4cqw}
.final .pod{font-size:1.6cqw;gap:.6cqw}
.final .pod .av{width:5cqw;height:5cqw;font-size:2.4cqw}
.final .pod .blk{width:11cqw;font-size:2.4cqw}
.awards{display:flex;gap:1.4cqw;justify-content:center;flex-wrap:wrap;max-width:92cqw}
.award{background:var(--t2);border-radius:1.4cqw;padding:1cqw 1.2cqw;width:19cqw;display:flex;flex-direction:column;align-items:center;gap:.3cqw;animation:pop .5s both}
.award:nth-child(2){animation-delay:.3s}.award:nth-child(3){animation-delay:.6s}.award:nth-child(4){animation-delay:.9s}
.award .ai{font-size:2.8cqw}.award .at{font-family:Bungee;font-size:1.4cqw;color:var(--gold)}.award .an{font-size:1.6cqw}
.award .ad{font-size:1.2cqw;color:var(--muted);text-align:center;overflow-wrap:anywhere}
.look{background:var(--t1);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.lookhead{display:flex;align-items:center;gap:10px}
.lookhead .av{width:44px;height:44px;font-size:20px}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}

class LocalStore {
  constructor(key){ this.key=key; this.data=LS.get(key,{}); this.subs=new Set(); this.pending=false;
    try{ this.bc=new BroadcastChannel(key); this.bc.onmessage=e=>{ this.data=e.data; this.emitSoon(); }; }catch(e){} }
  _walk(path,create){ const parts=path.split('/').filter(Boolean); let o=this.data;
    for(let i=0;i<parts.length-1;i++){ if(o[parts[i]]==null||typeof o[parts[i]]!=='object'){ if(!create) return [null,null]; o[parts[i]]={}; } o=o[parts[i]]; }
    return [o,parts[parts.length-1]]; }
  _peek(path){ const [o,k]=this._walk(path,false); return o ? clone(o[k] ?? null) : null; }
  _set(path,val){ const [o,k]=this._walk(path,true); if(val==null) delete o[k]; else o[k]=clone(val); }
  get(path){ return Promise.resolve(this._peek(path)); }
  set(path,val){ this._set(path,val); this.commit(); return Promise.resolve(); }
  update(path,obj){ for(const k in obj) this._set(path+'/'+k,obj[k]); this.commit(); return Promise.resolve(); }
  remove(path){ return this.set(path,null); }
  commit(){ LS.set(this.key,this.data); try{ this.bc && this.bc.postMessage(this.data); }catch(e){} this.emitSoon(); }
  emitSoon(){ if(this.pending) return; this.pending=true; queueMicrotask(()=>{ this.pending=false; for(const s of [...this.subs]) s.cb(this._peek(s.path)); }); }
  on(path,cb){ const s={path,cb}; this.subs.add(s); setTimeout(()=>{ if(this.subs.has(s)) cb(this._peek(path)); },0); return ()=>this.subs.delete(s); }
  now(){ return Date.now(); }
  presence(){}
}
class FireStore {
  constructor(db){ this.db=db; this.offset=0; db.ref('.info/serverTimeOffset').on('value',s=>this.offset=s.val()||0); }
  get(p){ return this.db.ref(p).get().then(s=>s.val()); }
  set(p,v){ return this.db.ref(p).set(v ?? null); }
  update(p,o){ return this.db.ref(p).update(o); }
  remove(p){ return this.db.ref(p).remove(); }
  on(p,cb){ const r=this.db.ref(p), f=s=>cb(s.val()); r.on('value',f); return ()=>r.off('value',f); }
  now(){ return Date.now()+this.offset; }
  presence(p){ const r=this.db.ref(p); this.db.ref('.info/connected').on('value',s=>{ if(s.val()){ r.onDisconnect().set(false); r.set(true); } }); }
}

function playbackMode(){ try{ if(navigator.audioSession && navigator.audioSession.type!=='playback') navigator.audioSession.type='playback'; }catch(e){} }
/* Keep the screen awake during a game (iPad host + player phones) */
const Awake = { want:false, lock:null,
  on(){ this.want=true; this.get(); },
  off(){ this.want=false; try{ this.lock && this.lock.release(); }catch(e){} this.lock=null; },
  get(){ if(!this.want||this.lock||!('wakeLock' in navigator)||document.visibilityState!=='visible') return;
    navigator.wakeLock.request('screen').then(l=>{ this.lock=l; l.addEventListener('release',()=>{ this.lock=null; }); }).catch(()=>{}); } };
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ Awake.get(); try{ Sound.ctx && Sound.ctx.state!=='running' && Sound.ctx.resume(); }catch(e){} } });

/* ============ Voice (built-in or your cloned voice via the Worker) ============ */
const Voice = {
  tok:0, el:null, cache:new Map(), pending:new Map(), voices:[], cancelled:false, last:{mode:'',error:''}, keep:false, active:0, queue:[], warned:'',
  unlock(){ playbackMode();
    try{ if(!this.el){ this.el=new Audio(); this.el.playsInline=true; }
      this.el.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA='; this.el.play().catch(()=>{});
      if(window.speechSynthesis){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); } }catch(e){} },
  loadVoices(){ try{ this.voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)); }catch(e){} return this.voices; },
  stopSoft(){ if(!this.keep) this.stop(); },
  stop(){ this.tok++; this.keep=false;
    try{ if(window.speechSynthesis && (speechSynthesis.speaking||speechSynthesis.pending)){ speechSynthesis.cancel(); this.cancelled=true; } }catch(e){}
    try{ this.el && this.el.pause(); }catch(e){} },
  async say(text, st, opt={}){ if(!st||!st.readAloud||!text) return this.last; this.stop(); this.keep=!!opt.keep; const tok=this.tok; Sound.duck(true);
    try{ if(st.voice==='clone' && CONFIG.WORKER_URL){ const url=await this.tts(text,true); if(tok!==this.tok) return this.last; this.last={mode:'clone',error:''};
           let ok=await this.play(url, st); if(!ok && tok===this.tok){ await sleep(300); if(tok===this.tok) ok=await this.play(url, st); }   /* retry once, then the built-in voice */
           if(!ok && tok===this.tok){ this.last={mode:'builtin',error:'playback failed'}; await this.builtin(text, st, tok); } }
         else { this.last={mode:'builtin',error:''}; await this.builtin(text, st, tok); } }
    catch(e){ console.warn('voice fallback',e); const m=e.message||String(e); this.last={mode:'builtin',error:m};
      if(!opt.quiet && this.warned!==m){ this.warned=m; toast(`Your voice failed: ${m.slice(0,90)} · using the built-in voice`); }
      if(tok===this.tok) await this.builtin(text, st, tok); }
    finally{ if(tok===this.tok){ Sound.duck(false); this.keep=false; } }
    return this.last; },
  tts(text,hi){ if(this.cache.has(text)) return Promise.resolve(this.cache.get(text)); if(this.pending.has(text)){ if(hi) this.bump(text); return this.pending.get(text); }
    const pr=(async()=>{ await this.slot(text,hi);
      try{ const r=await fetch(CONFIG.WORKER_URL.replace(/\/$/,'')+'/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
        if(!r.ok){ let m=''; try{ m=(await r.json()).error; }catch(e){} throw new Error(m||('HTTP '+r.status)); }
        const url=URL.createObjectURL(await r.blob()); this.cache.set(text,url); return url; }
      finally{ this.active--; const nx=this.queue.shift(); nx&&nx.go(); } })();
    this.pending.set(text,pr); pr.finally(()=>this.pending.delete(text)).catch(()=>{}); return pr; },
  slot(text,hi){ if(this.active<2){ this.active++; return Promise.resolve(); }
    return new Promise(res=>{ const j={text,go:()=>{ this.active++; res(); }}; hi?this.queue.unshift(j):this.queue.push(j); }); },
  bump(text){ const i=this.queue.findIndex(j=>j.text===text); if(i>0) this.queue.unshift(...this.queue.splice(i,1)); },   /* a line that's needed now jumps the line */  /* at most 2 voice requests at a time */
  prefetch(text, st, hi){ if(st && st.readAloud && st.voice==='clone' && CONFIG.WORKER_URL && text) this.tts(text,hi).catch(()=>{}); },
  play(url, st){ return new Promise(res=>{ if(!this.el){ this.el=new Audio(); this.el.playsInline=true; } const a=this.el; a.src=url; a.volume=Math.min(1,(st.volume??0.7)+0.3);
      a.onended=()=>res(true); a.onerror=()=>res(false); a.play().catch(()=>res(false)); setTimeout(()=>res(true),20000); }); },
  async builtin(text, st, tok){ if(!window.speechSynthesis) return;
    /* Reset before every line: stop any clip still playing and clear stuck speech (iOS can jam), then wait, since iOS drops speech that starts right after a cancel */
    try{ this.el && this.el.pause(); speechSynthesis.cancel(); speechSynthesis.resume(); }catch(e){} this.cancelled=false; await sleep(150);
    if(tok!==this.tok) return;
    await new Promise(res=>{ const u=new SpeechSynthesisUtterance(text); u.rate=st.voiceRate||1; u.volume=Math.min(1,(st.volume??0.7)+0.3);
      const v=this.loadVoices().find(v=>v.name===st.voiceName); if(v) u.voice=v;
      u.onend=u.onerror=()=>res(); speechSynthesis.speak(u); setTimeout(res,Math.max(4000,text.length*110)); }); }
};

/* ============ AI questions via the Worker ============ */
async function fetchAI(st, count){
  if(!CONFIG.WORKER_URL) throw new Error('No WORKER_URL set');
  const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),20000);
  try{
    const r=await fetch(CONFIG.WORKER_URL.replace(/\/$/,'')+'/question',{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json'},
      body:JSON.stringify({count, topic:st.aiTopic||'', family:st.audience==='family', avoid:LS.get('hg_used',[]).slice(-25)})});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
    return (j.questions||[]).map(x=>({t:fixBlank(x.text), a:String(x.answer||'').trim(), d:(x.decoys||[]).slice(0,3), src:'ai'})).filter(x=>x.t&&x.a);
  } finally { clearTimeout(to); }
}

/* ============ AI fake answers for "Lie for me" ============ */
const Fakes = { mem:new Map(), down:false,
  want(st){ return !!CONFIG.WORKER_URL && !this.down && st && st.aiFakes!==false; },
  get(q, st){ if(!q || !this.want(st)) return Promise.resolve(null);
    const key=q.t+'|'+q.a; if(this.mem.has(key)) return this.mem.get(key);
    const saved=LS.get('hg_fakes',{}); if(saved[key]) return Promise.resolve(saved[key]);
    const pr=(async()=>{ const ctrl=new AbortController(), to=setTimeout(()=>ctrl.abort(),10000);
      try{ const r=await fetch(CONFIG.WORKER_URL.replace(/\/$/,'')+'/fakes',{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json'},
          body:JSON.stringify({question:q.t,answer:q.a,count:8,family:st.audience==='family'})});
        const j=await r.json().catch(()=>({}));
        if(!r.ok){ if(/not set|api-key|authentication|credit/i.test(j.error||'')) this.down=true; throw new Error(j.error||('HTTP '+r.status)); }
        const seen=new Set(), list=[];
        for(let x of (j.fakes||[])){ x=String(x||'').trim(); const k=norm(x);
          if(!x||x.length>40||!k||seen.has(k)||isTruth(x,q)||(st.audience==='family'&&isNaughty(x))) continue; seen.add(k); list.push(x); }
        const c=LS.get('hg_fakes',{}); c[key]=list; const ks=Object.keys(c); if(ks.length>150) delete c[ks[0]]; LS.set('hg_fakes',c);
        return list;
      }catch(e){ console.warn('AI fakes failed',e); this.mem.delete(key); return null; }
      finally{ clearTimeout(to); } })();
    this.mem.set(key,pr); return pr; } };
function seeded(a, seed){ a=[...a]; let t=seed>>>0; const rnd=()=>{ t+=0x6D2B79F5; let x=Math.imul(t^t>>>15,1|t); x^=x+Math.imul(x^x>>>7,61|x); return ((x^x>>>14)>>>0)/4294967296; };
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ============ Room creation ============ */
function randCode(){ const L='ABCDEFGHJKLMNPQRSTUVWXYZ'; let s=''; for(let i=0;i<4;i++) s+=L[Math.floor(Math.random()*L.length)]; return s; }
async function cleanupRooms(){
  try{ const rooms=(await S.store.get(`${ROOT}/rooms`))||{}, cut=S.store.now()-24*3600*1000, p={};
    for(const [c,r] of Object.entries(rooms)) if(!r||!r.created||r.created<cut) p[c]=null;
    if(Object.keys(p).length) await S.store.update(`${ROOT}/rooms`,p);
  }catch(e){ console.warn('room cleanup failed',e); }
}
async function createRoom(demo, game='fibs'){
  await cleanupRooms();
  const settings=(demo&&S.real)?clone(S.real):await loadSettings();
  if(demo&&!S.real) settings.theme=LS.get('hg_theme','sunset');
  if(demo){ settings.lieTime=Math.min(settings.lieTime,45); settings.voteTime=Math.min(settings.voteTime,20); settings.minPlayers=2;
    settings.dDrawTime=Math.min(settings.dDrawTime,45); settings.dFakeTime=Math.min(settings.dFakeTime,30); settings.dVoteTime=Math.min(settings.dVoteTime,20); settings.minPlayers=2; }
  let code; for(let i=0;i<25;i++){ code=randCode(); if(!(await S.store.get(roomPath(code)))) break; }
  const now=S.store.now();
  const room={code,game:GNAMES[game]?game:'fibs',created:now,phase:'lobby',settings,players:{},demo:!!demo,qi:-1,round:0,games:0};
  if(demo) BOTS.forEach((n,i)=>room.players['bot'+i]={name:n,color:i+1,emoji:BOT_EMOJI[i],score:0,bot:true,joined:now+i,on:true,from:0});
  await S.store.set(roomPath(code),room);
  return code;
}

/* ============ Awards (end of game) ============ */
function awards(r){
  const ps=r.players||{}, St=r.stats||{}, out=[];
  const best=k=>{ let m=0, ids=[]; for(const id in St){ if(!ps[id]) continue; const v=(St[id]||{})[k]||0; if(v>m){ m=v; ids=[id]; } else if(v===m&&v>0) ids.push(id); } return {m,ids}; };
  const names=ids=>listNames(ids.map(i=>ps[i].name));
  let b=best('fooled'); if(b.m) out.push({icon:'🤥',title:'Best Liar',ids:b.ids,names:names(b.ids),detail:`Fooled ${b.m} ${b.m===1?'time':'times'}`});
  b=best('truth'); if(b.m) out.push({icon:'🕵️',title:'Truth Detective',ids:b.ids,names:names(b.ids),detail:`Found the truth ${b.m}×`});
  b=best('gullible'); if(b.m) out.push({icon:'🐟',title:'Most Gullible',ids:b.ids,names:names(b.ids),detail:`Fell for ${b.m} ${b.m===1?'lie':'lies'}`});
  if(r.best) out.push({icon:'😂',title:'Funniest Lie',ids:r.best.owners||[],names:r.best.names,detail:`“${r.best.text}” · ${r.best.likes} 👍`});
  return out;
}

/* ============ HOST (the TV screen + game engine) ============ */
function Host(code, mount, opts){
  if(!code){ mount.innerHTML='<div class="landing"><div class="logo" style="font-size:40px">HARDIN<span>GAMES</span></div><div class="muted" style="text-align:center">Setting up a room…</div></div>';
    createRoom(false, PARAMS.get('game')||'fibs').then(c=>nav({host:c},true)); return; }
  const store=S.store, P=roomPath(code);
  mount.classList.add('tv'); if(mount===app){ mount.classList.add('full'); document.body.style.overflow='hidden'; }
  mount.innerHTML=`<div class="stage"></div><div class="fx"></div><div class="tap"><div class="logo">HARDIN<span>GAMES</span></div><button>Tap to start</button><div class="note">Turns on sound and voice</div></div>`;
  const stage=$('.stage',mount), fx=$('.fx',mount), tap=$('.tap',mount);
  let R=null, first=true, cmdSeen=null, spoken='', lastCounts=null, lastTick=-1, done=new Set(), botMark=new Set(), unlocked=false, seenR=new Set(), lastClean=0;
  const once=k=>{ if(done.has(k)) return false; done.add(k); return true; };
  const upd=patch=>store.update(P,clone(patch));
  const now=()=>store.now();
  const multFor=r=> (r.settings.rounds>1 && r.round===r.settings.rounds) ? r.settings.finalMult : 1;
  const players=r=>Object.entries(r.players||{}).sort((a,b)=>(a[1].joined||0)-(b[1].joined||0));
  const late=(r,p)=>(p.from||0)>(r.qi??-1);
  const eligible=r=>players(r).filter(([id,p])=>p.on!==false && !late(r,p) && !(r.q && r.q.author===id)).map(([id])=>id);
  const nm=(r,id)=>(r.players&&r.players[id]&&r.players[id].name)||'Someone';
  const voters=(r,oid)=>Object.keys(r.votes||{}).filter(p=>r.votes[p]===oid);

  tap.onclick=()=>{ unlocked=true; tap.remove(); Voice.unlock(); Awake.on(); if(R) { Sound.init(R.settings); setMusicFor(R); spoken=''; maybeSpeak(R); } };

  const unsub=store.on(P, r=>{
    if(!r){ patchHTML(stage,`<div class="center"><div class="bigintro" style="font-size:5cqw">Room not found</div><button data-act="home">Back</button></div>`); return; }
    const prev=R; R=r; applyTheme(r.settings&&r.settings.theme);
    if(first){ first=false; cmdSeen=r.cmd&&r.cmd.id; if(r.phase==='loading') upd({phase:'lobby'}); Object.keys(r.reactions||{}).forEach(id=>seenR.add(id)); }
    if(r.cmd && r.cmd.id!==cmdSeen){ cmdSeen=r.cmd.id; act(r.cmd.t); }
    effects(prev,r); if(unlocked) setMusicFor(r); reactions(r); render(r);
  });
  const iv=setInterval(()=>{ tick(); timerUI(); cleanReacts(); },200);
  CLEAN.push(unsub,()=>clearInterval(iv),()=>{ mount.onclick=null; });

  mount.onclick=e=>{ const b=e.target.closest('[data-act]'); if(b) act(b.dataset.act); };

  function act(t){ const r=R; if(!r) return; const n=now();
    if(t==='home') return nav({});
    if(t==='start') return startGame();
    if(t==='pause' && !r.paused && r.phase!=='lobby' && r.phase!=='final') return upd({paused:true,remaining:Math.max(0,(r.endsAt||n)-n)});
    if(t==='resume' && r.paused) return upd({paused:false,endsAt:n+(r.remaining||0)});
    if(t==='skip'){ if(r.paused) upd({paused:false});
      if(r.phase==='intro') return beginQuestion();
      if(['lie','vote','reveal'].includes(r.phase)) return upd({phase:'scores',deltas:null,lq:null,scored:r.qi,phaseAt:n,endsAt:n+2500});
      if(r.phase==='scores') return afterScores(); }
    if(t==='again'){ done=new Set(); const p={phase:'lobby',queue:null,q:null,qi:-1,round:0,lies:null,auto:null,votes:null,likes:null,options:null,items:null,deltas:null,scored:null,submitted:null,paused:false,endsAt:null,stats:null,best:null,lq:null};
      for(const id in r.players){ p[`players/${id}/score`]=0; p[`players/${id}/from`]=0; } return upd(p); }
  }

  /* ---- engine ---- */
  async function startGame(){
    const r=R; if(!r||r.phase!=='lobby') return;
    const count=players(r).filter(([,p])=>p.on!==false).length;
    if(count<r.settings.minPlayers){ toast(`Need at least ${r.settings.minPlayers} players`); return; }
    if(!once('start'+(r.games||0))) return;
    const st=r.settings, total=st.rounds*st.perRound;
    upd({phase:'loading',phaseAt:now()});
    let pool=[]; for(const k in PACKS) if(st.packs[k]) pool.push(...PACKS[k].q.map(x=>({...x,src:k})));
    if(st.packs.family){ const fam=(await store.get(`${ROOT}/packs/family`))||{};
      pool.push(...Object.values(fam).filter(x=>st.audience!=='family'||x.safe!==false).map(x=>({t:x.t,a:x.a,d:x.d||[],src:'family'}))); }
    const used=LS.get('hg_used',[]); pool=shuffle(pool).sort((a,b)=>(used.includes(a.t)?1:0)-(used.includes(b.t)?1:0));
    const subs=shuffle(Object.values(r.submitted||{})).slice(0,total).map(x=>({t:x.t,a:x.a,d:[],author:x.author,by:x.by,src:'player'}));
    let aiN=({off:0,one:st.rounds,half:Math.ceil(total/2),all:total})[st.aiMix]||0; aiN=Math.min(aiN,total-subs.length);
    let ai=[]; if(aiN>0 && CONFIG.WORKER_URL){ try{ ai=await fetchAI(st,aiN); }catch(e){ console.warn('AI questions failed',e); } }
    const slots=new Array(total).fill(null);
    subs.forEach((s,i)=>{ let pos=Math.floor((i+0.5)*total/subs.length)%total; while(slots[pos]) pos=(pos+1)%total; slots[pos]=s; });
    ai.forEach((a,i)=>{ const free=slots.map((x,k)=>x?-1:k).filter(k=>k>=0); if(!free.length) return;
      const inR=free.filter(k=>Math.floor(k/st.perRound)===i%st.rounds); const arr=inR.length?inR:free; slots[arr[Math.floor(Math.random()*arr.length)]]=a; });
    for(let k=0;k<total;k++) if(!slots[k]) slots[k]=pool.shift()||null;
    const queue=slots.filter(Boolean);
    if(!queue.length){ upd({phase:'lobby'}); toast('No questions — turn on a pack in Admin'); done.delete('start'+(r.games||0)); return; }
    const n=now(), p={phase:'intro',round:1,qi:-1,queue,q:null,scored:null,lies:null,auto:null,votes:null,likes:null,stats:null,best:null,lq:null,phaseAt:n,endsAt:n+4500,games:(r.games||0)+1,paused:false};
    for(const id in r.players){ p[`players/${id}/score`]=0; p[`players/${id}/from`]=0; }
    upd(p);
  }
  function beginQuestion(){ const r=R, qi=(r.qi??-1)+1; if(!r.queue||!r.queue[qi]||!once('q'+r.games+'_'+qi)) return;
    const st=r.settings, n=now(), q=r.queue[qi], f=st.audience==='family'?1.5:1;
    const wantF=st.lieForMe!==false && Fakes.want(st), g=r.games;
    upd({phase:'lie',qi,q,lies:null,auto:null,votes:null,likes:null,lq:null,options:null,items:null,step:0,deltas:null,fakes:null,fk:wantF?'loading':'none',phaseAt:n,endsAt:n+st.lieTime*1000*f});
    if(wantF) Fakes.get(q,st).then(list=>{ if(R && R.qi===qi && R.games===g) upd({fakes:list&&list.length?list:null, fk:'ready'}); });
    const u=LS.get('hg_used',[]).filter(x=>x!==q.t); u.push(q.t); LS.set('hg_used',u.slice(-200)); }
  function beginVote(){ const r=R; if(!once('v'+r.games+'_'+r.qi)) return;
    const q=r.q, groups=new Map();
    for(const [pid,txt] of Object.entries(r.lies||{})){ const k=norm(txt); if(!k) continue; if(!groups.has(k)) groups.set(k,{text:String(txt).trim(),owners:[]}); groups.get(k).owners.push(pid); }
    const opts=[{id:'truth',text:q.a,truth:true}]; let i=0; for(const g of groups.values()) opts.push({id:'l'+(i++),text:g.text,owners:g.owners});
    const usedN=new Set([norm(q.a),...groups.keys()]); let j=0;
    for(const d of shuffle(q.d||[])){ if(opts.length>=4) break; const k=norm(d); if(usedN.has(k)) continue; usedN.add(k); opts.push({id:'h'+(j++),text:d,house:true}); }
    const st=r.settings, n=now(), f=st.audience==='family'?1.5:1;
    upd({phase:'vote',options:shuffle(opts),votes:null,phaseAt:n,endsAt:n+st.voteTime*1000*f}); }
  const lieShare=(r,o,ow,n)=>Math.round(r.settings.pointsFool*multFor(r)*n*((r.auto||{})[ow]?0.5:1));
  function beginReveal(){ const r=R; if(!once('r'+r.games+'_'+r.qi)) return;
    const st=r.settings, mult=multFor(r), opts=r.options||[], deltas={}, stats=clone(r.stats||{}); let fooledAll=0;
    const add=(p,v)=>{ if(r.players[p]&&v) deltas[p]=(deltas[p]||0)+v; };
    const bump=(p,k,v=1)=>{ if(!r.players[p]||!v) return; stats[p]=stats[p]||{}; stats[p][k]=(stats[p][k]||0)+v; };
    for(const o of opts){ const vs=voters(r,o.id);
      if(o.truth){ vs.forEach(p=>{ add(p,st.pointsTruth*mult); bump(p,'truth'); }); continue; }
      fooledAll+=vs.length; vs.forEach(p=>bump(p,'gullible'));
      if(!o.house) (o.owners||[]).forEach(ow=>{ const n=vs.filter(v=>v!==ow).length; add(ow,lieShare(r,o,ow,n)); bump(ow,'fooled',n); }); }
    if(r.q.author && fooledAll) add(r.q.author,st.authorBonus*mult*fooledAll);
    const items=opts.filter(o=>!o.truth && voters(r,o.id).length).sort((a,b)=>voters(r,a.id).length-voters(r,b.id).length).map(o=>o.id);
    items.push('truth'); const n=now();
    upd({phase:'reveal',items,step:0,deltas,stats,phaseAt:n,endsAt:n+(items[0]==='truth'?TRUTH_MS:LIE_MS)}); }
  function nextReveal(){ const r=R; if(!once('s'+r.games+'_'+r.qi+'_'+r.step)) return; const n=now();
    if(r.step+1<r.items.length) return upd({step:r.step+1,endsAt:n+(r.items[r.step+1]==='truth'?TRUTH_MS:LIE_MS)});
    const p={phase:'scores',phaseAt:n,endsAt:n+6500};
    if(r.scored!==r.qi){ const st=r.settings, deltas=Object.assign({},r.deltas||{}), opts=r.options||[], cnt={}, lp=st.likePoints||0;
      if(st.likes!==false) for(const [who,m] of Object.entries(r.likes||{})) for(const oid in (m||{})){ const o=opts.find(x=>x.id===oid);
        if(!m[oid]||!o||o.truth||o.house||(o.owners||[]).includes(who)) continue; cnt[oid]=(cnt[oid]||0)+1; }
      let topL=null;
      for(const [oid,c] of Object.entries(cnt)){ const o=opts.find(x=>x.id===oid);
        (o.owners||[]).forEach(ow=>{ if(r.players[ow]&&lp) deltas[ow]=(deltas[ow]||0)+c*lp; });
        if(!topL||c>topL.likes) topL={text:o.text,owners:o.owners||[],names:listNames((o.owners||[]).map(x=>nm(r,x))),likes:c,pts:c*lp}; }
      p.lq=topL; if(topL && (!r.best || topL.likes>r.best.likes)) p.best=topL;
      p.deltas=deltas;
      for(const [id,d] of Object.entries(deltas)) if(r.players[id]) p[`players/${id}/score`]=(r.players[id].score||0)+d;
      p.scored=r.qi; }
    upd(p); }
  function afterScores(){ const r=R; if(!once('a'+r.games+'_'+r.qi)) return; const st=r.settings, n=now(), nq=r.qi+1;
    if(nq>=(r.queue||[]).length) return upd({phase:'final',phaseAt:n,endsAt:null});
    const nr=Math.floor(nq/st.perRound)+1;
    if(nr!==r.round) return upd({phase:'intro',round:nr,phaseAt:n,endsAt:n+4500});
    beginQuestion(); }
  function tick(){ const r=R; if(!r||r.paused||['lobby','final','loading'].includes(r.phase)) return; const n=now();
    if(r.demo) botTick(r,n);
    if(r.phase==='intro' && n>=r.endsAt) beginQuestion();
    else if(r.phase==='lie'){ const el=eligible(r), L=r.lies||{}; if((el.length && el.every(id=>L[id])) || n>=r.endsAt) beginVote(); }
    else if(r.phase==='vote'){ const el=eligible(r), V=r.votes||{}; if((el.length && el.every(id=>V[id])) || n>=r.endsAt) beginReveal(); }
    else if(r.phase==='reveal' && n>=r.endsAt) nextReveal();
    else if(r.phase==='scores' && n>=r.endsAt) afterScores(); }
  function botTick(r,n){ const st=r.settings;
    for(const [id,p] of Object.entries(r.players||{})){ if(!p.bot) continue; const delay=1800+hash(id+r.qi+r.games)%7000, k=r.games+'_'+r.qi+id;
      if(r.phase==='lie' && !(r.lies||{})[id] && n-r.phaseAt>delay && !botMark.has('l'+k)){ botMark.add('l'+k);
        const taken=new Set(Object.values(r.lies||{}).map(norm)); const pick=shuffle([...(r.fakes||[]),...(r.q.d||[])]).concat(shuffle(BOT_LIES)).find(c=>!isTruth(c,r.q)&&!taken.has(norm(c)))||'a llama';
        upd({[`lies/${id}`]:pick}); }
      if(r.phase==='vote' && !(r.votes||{})[id] && n-r.phaseAt>delay*0.6 && !botMark.has('v'+k)){ botMark.add('v'+k);
        const opts=(r.options||[]).filter(o=>!(o.owners||[]).includes(id)); const lies=opts.filter(o=>!o.truth);
        const pick=(Math.random()<0.4||!lies.length)?'truth':lies[Math.floor(Math.random()*lies.length)].id; upd({[`votes/${id}`]:pick}); }
      if(r.phase==='reveal' && st.likes!==false && n-r.phaseAt>2500 && !botMark.has('k'+k)){ botMark.add('k'+k);
        const ls=(r.options||[]).filter(o=>!o.truth&&!o.house&&!(o.owners||[]).includes(id));
        if(ls.length && Math.random()<0.5) upd({[`likes/${id}/${ls[Math.floor(Math.random()*ls.length)].id}`]:true}); }
      if(['reveal','scores'].includes(r.phase) && st.reactions!==false && Math.random()<0.005) upd({[`reactions/${uid()}`]:{e:REACTS[Math.floor(Math.random()*REACTS.length)],t:n,p:id}}); } }

  /* ---- reactions + confetti ---- */
  function reactions(r){ const rs=r.reactions||{}, n=now();
    for(const [id,x] of Object.entries(rs)){ if(seenR.has(id)) continue; seenR.add(id);
      if(!x||!REACTS.includes(x.e)||n-(x.t||0)>5000||fx.childElementCount>60) continue; floatEmoji(x.e); } }
  function cleanReacts(){ const r=R, n=now(); if(!r||!r.reactions||n-lastClean<3000) return; lastClean=n;
    const p={}; for(const [id,x] of Object.entries(r.reactions)) if(!x||n-(x.t||0)>6000) p[`reactions/${id}`]=null; if(Object.keys(p).length) upd(p); }
  function floatEmoji(e){ const d=document.createElement('div'); d.className='floater'; d.textContent=e; d.style.left=(6+Math.random()*86)+'%';
    d.style.setProperty('--dx',(Math.random()*16-8)+'cqw'); fx.appendChild(d); setTimeout(()=>d.remove(),3200); Sound.sfx('pop'); }
  function confetti(){ for(let i=0;i<70;i++){ const c=document.createElement('i'); c.className='conf'; c.style.left=(Math.random()*100)+'%'; c.style.background=COLORS[i%8];
      c.style.animationDelay=(Math.random()*0.6)+'s'; c.style.setProperty('--dx',(Math.random()*20-10)+'cqw'); c.style.setProperty('--r',(Math.random()*720-360)+'deg');
      fx.appendChild(c); setTimeout(()=>c.remove(),3600); } }

  /* ---- effects: sound + voice ---- */
  function setMusicFor(r){ musicFor(r,{lie:'think',vote:'think',reveal:'reveal'}); }
  function effects(prev,r){
    const c={p:Object.keys(r.players||{}).length,l:Object.keys(r.lies||{}).length,v:Object.keys(r.votes||{}).length};
    if(lastCounts && unlocked){ if(c.p>lastCounts.p) Sound.sfx('join'); if(c.l>lastCounts.l||c.v>lastCounts.v) Sound.sfx('lock'); }
    lastCounts=c;
    if(prev && (prev.phase!==r.phase || prev.step!==r.step)){
      setMusicFor(r);
      if(r.phase==='intro') Sound.sfx('start');
      if(r.phase==='reveal'){ const o=(r.options||[]).find(o=>o.id===r.items[r.step]);
        if(o && o.truth){ const found=voters(r,o.id).length; Sound.sfx('drumroll'); setTimeout(()=>{ Sound.sfx('ding'); if(found) confetti(); },DRUM_MS); }
        else { Sound.sfx('whoosh'); setTimeout(()=>Sound.sfx(o&&o.house?'buzz':'stamp'),1200); } }
      if(r.phase==='scores') Sound.sfx('points');
      if(r.phase==='final'){ Sound.sfx('fanfare'); confetti(); setTimeout(confetti,1000); }
    }
    if((r.phase==='intro'||r.phase==='loading') && r.queue && r.queue[r.qi+1]) Voice.prefetch(readQ(r.queue[r.qi+1].t), r.settings, true);
    if(r.phase==='scores' && r.queue && r.queue[r.qi+1]) Voice.prefetch(readQ(r.queue[r.qi+1].t), r.settings, true);
    if((r.phase==='scores'||r.phase==='intro') && r.queue && r.queue[r.qi+1] && r.settings.lieForMe!==false) Fakes.get(r.queue[r.qi+1], r.settings);
    if((r.phase==='lie'||r.phase==='vote') && r.q) Voice.prefetch(`The truth is… ${r.q.a}!`, r.settings);
    if(r.phase==='loading'||(r.phase==='lobby'&&!prev)){ ["Let's play Fibs! Round one!",'Final round! Everything is worth double!',...[2,3,4,5].map(n=>`Round ${WORDS[n]}!`).slice(0,Math.max(0,r.settings.rounds-2))].forEach(t=>Voice.prefetch(t,r.settings)); }
    if(r.phase==='scores' && r.queue && r.qi+1>=r.queue.length){ const top=players(r).sort((a,b)=>(b[1].score||0)-(a[1].score||0))[0]; if(top) Voice.prefetch(`And the winner is… ${top[1].name}!`, r.settings); }

  }
  function maybeSpeak(r){ const s=speechFor(r); if(!s||s[0]===spoken) return; spoken=s[0]; if(s[1]) Voice.say(s[1], r.settings); }
  function speechFor(r){
    switch(r.phase){
      case 'lobby': return ['lobby'+r.games, r.games?'':'Welcome to Hardin Games! Grab your phones and join with the code on the screen.'];
      case 'intro': return ['i'+r.games+'_'+r.round, multFor(r)>1?'Final round! Everything is worth double!':(r.round===1?"Let's play Fibs! Round one!":`Round ${WORDS[r.round]||r.round}!`)];
      case 'lie': return ['l'+r.games+'_'+r.qi, readQ(r.q.t)];
      case 'vote': return ['v'+r.games+'_'+r.qi, ''];
      case 'reveal': { const o=(r.options||[]).find(x=>x.id===r.items[r.step]); return ['r'+r.games+'_'+r.qi+'_'+r.step, o&&o.truth?`The truth is… ${o.text}!`:'']; }
      case 'scores': return ['sc'+r.games+'_'+r.qi, ''];
      case 'final': { const top=players(r).sort((a,b)=>(b[1].score||0)-(a[1].score||0))[0]; return ['f'+r.games, top?`And the winner is… ${top[1].name}!`:'']; }
    } return null; }

  /* ---- rendering ---- */
  function timerUI(){ const r=R, el=$('.timer',stage); if(!r||!el) return; const left=r.paused?(r.remaining||0):Math.max(0,(r.endsAt||0)-now()); const s=Math.ceil(left/1000);
    if(el.textContent!==String(s)) el.textContent=s; el.classList.toggle('low',s<=5&&!r.paused);
    if(s<=5 && s>0 && s!==lastTick && !r.paused && unlocked){ Sound.sfx('tick'); } lastTick=s; }
  function top(r){ const lbl=r.phase==='lobby'||r.phase==='final'?'':(r.round?`ROUND ${r.round}${multFor(r)>1?' · DOUBLE POINTS':''}`:'');
    return `<div class="tvtop"><span><b>HARDIN GAMES</b> · FIBS</span><span>${lbl}</span><span>CODE <b>${esc(r.code)}</b></span></div>`; }
  function tiles(r, mark){ return `<div class="strip">${players(r).map(([id,p])=>`<div class="tile ${p.on===false||late(r,p)?'off':''}">${mark(id)?'<span class="chk">✓</span>':''}${avatar(p)}<span class="nm">${esc(p.name)}</span></div>`).join('')}</div>`; }
  function ctl(r){ if(['lobby','final','loading'].includes(r.phase)) return ''; return `<div class="hostctl"><button class="alt" data-act="${r.paused?'resume':'pause'}">${r.paused?'Resume':'Pause'}</button><button class="alt" data-act="skip">Skip</button></div>`; }
  function render(r){ let body='';

      case 'lobby': { const url=joinUrl(r.code), ps=players(r), max=st.maxPlayers, subs=Object.keys(r.submitted||{}).length;
        const tl=ps.map(([id,p])=>`<div class="tile ${p.on===false?'off':''}">${avatar(p)}<span class="nm">${esc(p.name)}${p.bot?' 🤖':''}${r.vip===id?' ⭐':''}</span></div>`).join('')+
          Array.from({length:Math.max(0,Math.min(8,max)-ps.length)},()=>'<div class="tile empty">open</div>').join('');
        body=`<div class="lobby"><div><div class="logo">HARDIN<span>GAMES</span></div><div class="gname">FIBS</div>
          <div class="codebox">${url?'<div class="qr" id="qr"></div>':''}<div><div class="lbl">JOIN ON YOUR PHONE WITH CODE</div><div class="code">${esc(r.code)}</div>${url?`<div class="url">${esc(url.replace(/^https?:\/\//,''))}</div>`:''}</div></div></div>
          <div style="display:flex;flex-direction:column;gap:2cqw"><div class="tiles">${tl}</div>
          <div class="note">${ps.length}/${max} players${subs?` · ${subs} player question${subs>1?'s':''} ready`:''}${st.audience==='family'?' · Family mode':''}${voiceTag(st)}</div>
          <div class="tvbtns"><button data-act="start" ${ps.length<st.minPlayers?'disabled':''}>Everybody's in — start!</button></div></div></div>`; break; }
      case 'loading': body=`<div class="center"><div class="bigintro" style="font-size:5cqw">Getting questions ready…</div></div>`; break;
      case 'intro': body=`<div class="center"><div class="bigintro">${multFor(r)>1?'FINAL ROUND':'ROUND '+r.round}</div><div class="subintro">${multFor(r)>1?'Everything is worth double!':'Get your lies ready'}</div></div>`; break;
      case 'lie': body=`<div class="center"><div class="qsrc">${r.q.src==='ai'?'Fresh AI question':r.q.by?'Written by '+esc(r.q.by):'Question '+(r.qi+1)}</div>

      case 'vote': body=`<div class="center"><div class="question" style="font-size:2.6cqw">${showQ(r.q.t)}</div>
          <div class="opts">${(r.options||[]).map(o=>`<div class="opt">${esc(o.text)}</div>`).join('')}</div>${tiles(r,id=>(r.votes||{})[id]||(r.q.author===id))}</div><div class="timer"></div>`; break;
      case 'reveal': { const id=r.items[r.step], o=(r.options||[]).find(x=>x.id===id)||{text:''}, vs=voters(r,id), mult=multFor(r);
        const strip=vs.length?`<div class="strip">${vs.map(p=>`<div class="tile">${avatar(r.players[p])}<span class="nm">${esc(nm(r,p))}</span></div>`).join('')}</div>`:'';
        const qline=`<div class="question" style="font-size:2.2cqw;opacity:.8">${showQ(r.q.t)}</div>`;
        if(o.truth){ const total=Object.keys(r.votes||{}).length, fooledP=(r.options||[]).filter(x=>!x.truth&&!x.house).reduce((a,x)=>a+voters(r,x.id).length,0);
          const quip=total&&!fooledP?QUIPS[((r.qi||0)+(r.games||0))%QUIPS.length]:'';
          body=`<div class="center" data-k="truth">${qline}<div class="drum">The truth is…</div><div class="revcard truth late1">${esc(o.text)}</div>
            <div class="late2">${vs.length?strip+`<div class="revlbl tr">FOUND IT! +${st.pointsTruth*mult} each</div>`:'<div class="revlbl lie">NOBODY FOUND IT!</div>'}
            ${quip?`<div class="quip">${esc(quip)}</div>`:''}${r.q.by?`<div class="note">Question by ${esc(r.q.by)}</div>`:''}</div></div>`;
        } else { const owners=o.owners||[], who=o.house?'A HARDIN HOUSE LIE!':`${listNames(owners.map(p=>nm(r,p))).toUpperCase()}'S LIE!`;
          const amt=!o.house&&vs.length&&owners[0]?lieShare(r,o,owners[0],vs.length):0;
          body=`<div class="center" data-k="${esc(id)}">${qline}<div class="cardwrap"><div class="revcard">${esc(o.text)}</div><div class="stamp ${o.house?'house':''}">${o.house?'HOUSE LIE':'BUSTED!'}</div></div>
            ${strip}<div class="revlbl ${o.house?'house':'lie'}">${esc(who)}</div>${amt?`<div class="pts">+${amt}${owners.length>1?' each':''}</div>`:''}</div>`; }
        break; }
      case 'scores': { const d=r.deltas||{}; const rows=players(r).sort((a,b)=>(b[1].score||0)-(a[1].score||0));
        body=`<div class="center"><div class="bigintro" style="font-size:4.5cqw">SCORES</div>
          ${r.lq?`<div class="lq">😂 Funniest lie: “${esc(r.lq.text)}” — ${esc(r.lq.names)} <b>+${r.lq.pts}</b></div>`:''}
          <div class="board">${rows.map(([id,p])=>`<div class="brow">${avatar(p)}<span class="nm">${esc(p.name)}</span><span class="dl">${d[id]?'+'+d[id]:''}</span><span class="sc">${p.score||0}</span></div>`).join('')}</div></div>`; break; }
      case 'final': { const rows=players(r).sort((a,b)=>(b[1].score||0)-(a[1].score||0)); const pod=[rows[1],rows[0],rows[2]], aw=awards(r);
        body=`<div class="center final"><div class="bigintro" style="font-size:4.2cqw">${rows[0]?esc(rows[0][1].name)+' WINS!':'GAME OVER'}</div>
          <div class="podium">${pod.map((x,i)=>x?`<div class="pod">${avatar(x[1])}<div>${esc(x[1].name)}</div><div class="blk" style="height:${[6,9,4][i]}cqw">${x[1].score||0}</div></div>`:'').join('')}</div>
          ${aw.length?`<div class="awards">${aw.map(a=>`<div class="award"><div class="ai">${a.icon}</div><div class="at">${a.title}</div><div class="an">${esc(a.names)}</div><div class="ad">${esc(a.detail)}</div></div>`).join('')}</div>`:''}
          <div class="tvbtns"><button data-act="again">Play again</button><button class="alt" data-act="home">Exit</button></div></div>`; break; }
    }
    patchHTML(stage, top(r)+body+ctl(r)+(r.paused?'<div class="paused">PAUSED</div>':''));
    const qr=$('#qr',stage); if(qr && !qr.firstChild && window.QRCode){ try{ new QRCode(qr,{text:joinUrl(r.code),width:256,height:256,colorDark:'#170c2e',colorLight:'#ffffff'}); }catch(e){} }
    timerUI();
  }
}

/* ============ PLAYER (phone controller) ============ */
function Player(code, mount, fixedPid){
  const store=S.store, P=roomPath(code), inApp=mount===app;
  let R=null, loaded=false, pid=fixedPid||LS.get('hg_pid_'+code,null), msg='', psound=LS.get('hg_psound',false), pctx=null, lastPhase='',
      selEmoji=null, selPhoto=null, editing=false, lastReact=0, lfm={key:'',open:false,shown:[],cursor:0};
  mount.classList.add('phone'); if(!inApp) mount.classList.add('framed');
  mount.innerHTML='<div class="pwrap" style="display:flex;flex-direction:column;flex:1"><div class="phd"></div><div class="pvid"><div class="ytbox"></div><button class="pvtap">▶ Tap to show the lyrics</button></div><div class="pmain" style="display:flex;flex-direction:column;flex:1"></div></div>';
  const root=$('.pmain',mount), headEl=$('.phd',mount), pvEl=$('.pvid',mount);
  const paint2=(h,b)=>{ patchHTML(headEl,h); patchHTML(root,b); };
  if(pid && !fixedPid) store.presence(`${P}/players/${pid}/on`);
  const unsub=store.on(P, r=>{ R=r; loaded=true; if(r) applyTheme(r.settings&&r.settings.theme); render(); micSync(r); });

  /* Singer's phone as the mic: WebRTC to the TV, voice is muted on the TV until it goes live */
  let rtc={k:'',pc:null,stream:null,state:'',err:'',answered:false};
  const micLive=r=>!!r && !r.paused && (r.settings.mMic==='all'?['sing','stop'].includes(r.phase):r.phase==='stop');
  const canMic=()=>!!(window.RTCPeerConnection && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  function micStop(){ try{ rtc.stream&&rtc.stream.getTracks().forEach(t=>t.stop()); }catch(e){} try{ rtc.pc&&rtc.pc.close(); }catch(e){} rtc={k:'',pc:null,stream:null,state:'',err:'',answered:false}; }
  async function micStart(r){ const k=micKey(r); micStop(); rtc.k=k; rtc.state='asking'; render();
    try{ const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
      if(rtc.k!==k){ stream.getTracks().forEach(t=>t.stop()); return; }
      const pc=new RTCPeerConnection({iceServers:ICE}); rtc.pc=pc; rtc.stream=stream; rtc.state='connecting'; render();
      stream.getTracks().forEach(t=>{ t.enabled=micLive(R); pc.addTrack(t,stream); });
      pc.onconnectionstatechange=()=>{ if(rtc.pc!==pc) return; const c=pc.connectionState;
        if(c==='connected') rtc.state='on'; else if(c==='failed'||c==='disconnected'){ rtc.state='fail'; rtc.err="Lost the TV. Make sure you're on the same Wi-Fi."; } render(); };
      await pc.setLocalDescription(await pc.createOffer()); await iceDone(pc);
      if(rtc.pc!==pc) return; await upd({rtc:{k,offer:pc.localDescription.sdp,from:pid}});
      setTimeout(()=>{ if(rtc.pc===pc && rtc.state==='connecting'){ rtc.state='fail'; rtc.err="Couldn't reach the TV. Make sure you're on the same Wi-Fi."; render(); } },15000);
    }catch(e){ rtc.state='fail'; rtc.err=/NotAllowed|Permission|denied/i.test((e.name||'')+(e.message||''))?'The mic is blocked. Allow it in Settings › Safari › Microphone, then try again.':"The mic didn't start: "+(e.message||e); render(); } }
  function micSync(r){ if(!rtc.k) return;

async function fetchTrivia(cat, n, numbers, st, hard, avoid){
  const ctrl=new AbortController(), to=setTimeout(()=>ctrl.abort(),25000);
  try{
    const r=await fetch(CONFIG.WORKER_URL.replace(/\/$/,'')+'/trivia',{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json'},
      body:JSON.stringify({category:cat,count:n,numbers,family:st.audience==='family',hard:!!hard,avoid})});
    const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
    const out=[];
    for(const x of (j.questions||[])){
      const q=String(x.q||'').trim(); if(!q||q.length>220) continue;
      if(x.type==='num'){ const v=Number(String(x.answer).replace(/,/g,'')); if(!isFinite(v)) continue; out.push({type:'num',q,answer:v,unit:String(x.unit||'').slice(0,20),cat,src:'ai'}); }

        const ch=shuffle(all); out.push({type:'mc',q,choices:ch,answer:ch.indexOf(c),cat,src:'ai'}); }

async function loadTrivia(cat, n, numbers, st, o={}){
  const flagged=o.flagged||new Set(), used=LS.get('hg_tused',[]), usedS=new Set(used);
  let got=[];
  if(CONFIG.WORKER_URL && st.tAI!==false){ try{ got=await fetchTrivia(cat,n,numbers,st,o.hard,used.slice(-40).concat(o.flaggedList||[]).slice(-60)); }catch(e){ console.warn('AI trivia failed',e); } }
  got=got.filter(q=>!flagged.has(String(hash(q.q))));
  let mc=got.filter(q=>q.type==='mc').slice(0,n-numbers), nm=got.filter(q=>q.type==='num').slice(0,numbers);
  const have=new Set([...mc,...nm].map(q=>q.q));
  const fill=(isNum,k)=>{ if(k<=0) return [];
    const pool=shuffle(TBANK.filter(b=>('n' in b)===isNum && !flagged.has(String(hash(b.q))) && !have.has(b.q)));
    pool.sort((a,b)=>((b.c===cat)-(a.c===cat)) || (usedS.has(a.q)-usedS.has(b.q)));
    return pool.slice(0,k).map(b=>{ const q=bankQ(b); q.cat=cat; return q; }); };
  mc=mc.concat(fill(false,n-numbers-mc.length)); nm=nm.concat(fill(true,numbers-nm.length));
  const out=shuffle(mc); if(nm.length){ const pos=out.length?1+Math.floor(Math.random()*out.length):0; out.splice(pos,0,...nm); }
  return out;
}
function pickCats(r, usedCats){
  const st=r.settings, fam=st.audience==='family';
  const custom=String(st.tCats||'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,20);
  const base=TCATS.filter(([,k])=>!fam||k).map(([n])=>n);
  const used=new Set(usedCats||[]);
  let pool=shuffle([...new Set([...custom,...base])].filter(c=>!used.has(c)));
  if(custom.length){ const c=shuffle(custom.filter(x=>!used.has(x))); if(c.length) pool=[c[0],...pool.filter(x=>x!==c[0])]; }
  return shuffle(pool.slice(0,3));
}
function tAwards(r){
  const ps=r.players||{}, St=r.tstats||{}, out=[], names=ids=>listNames(ids.map(i=>ps[i].name));
  const best=(f,min,low)=>{ let m=null, ids=[]; for(const id in St){ if(!ps[id]) continue; const v=f(St[id]||{}); if(v==null||(!low&&v<min)) continue;
      if(m==null||(low?v<m:v>m)){ m=v; ids=[id]; } else if(v===m) ids.push(id); } return {m,ids}; };
  let b=best(s=>s.correct||0,1); if(b.m) out.push({icon:'🧠',title:'Brainiac',ids:b.ids,names:names(b.ids),detail:`${b.m} right`});
  b=best(s=>(s.nmc||0)>=2?Math.round(s.time/s.nmc/100)/10:null,0,true); if(b.m!=null) out.push({icon:'⚡',title:'Speed Demon',ids:b.ids,names:names(b.ids),detail:`${b.m}s per right answer`});
  b=best(s=>s.best||0,3); if(b.m) out.push({icon:'🔥',title:'Hot Streak',ids:b.ids,names:names(b.ids),detail:`${b.m} in a row`});
  b=best(s=>s.bull||0,1); if(b.m) out.push({icon:'🎯',title:'Bullseye',ids:b.ids,names:names(b.ids),detail:`Closest guess ${b.m}×`});
  return out;
}

async function getPrompts(st, count){
  const seen=new Set(), out=[], used=new Set(LS.get('hg_dused',[]));
  const add=x=>{ x=String(x||'').trim().replace(/^["']|["']$/g,''); const k=norm(x); if(!x||x.length>40||!k||seen.has(k)||(st.audience==='family'&&isNaughty(x))) return; seen.add(k); out.push(x); };
  const custom=String(st.dPrompts||'').split(/[\n,]/).map(s=>s.trim()).filter(Boolean);
  shuffle(custom).slice(0,Math.ceil(count/3)).forEach(add);
  if(st.dAI!==false && CONFIG.WORKER_URL){
    const ctrl=new AbortController(), to=setTimeout(()=>ctrl.abort(),15000);
    try{ const r=await fetch(CONFIG.WORKER_URL.replace(/\/$/,'')+'/prompts',{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json'},
        body:JSON.stringify({count:Math.min(40,count),family:st.audience==='family',avoid:[...used].slice(-40)})});
      const j=await r.json().catch(()=>({})); if(r.ok) (j.prompts||[]).forEach(add); else console.warn('AI prompts failed',j.error);
    }catch(e){ console.warn('AI prompts failed',e); } finally{ clearTimeout(to); }
  }
  shuffle(DPROMPTS).sort((a,b)=>used.has(a)-used.has(b)).forEach(x=>{ if(out.length<count) add(x); });
  return out.slice(0,count);
}

    const prev=R; R=r; applyTheme(r.settings&&r.settings.theme);
    if(first){ first=false; cmdSeen=r.cmd&&r.cmd.id; Object.keys(r.reactions||{}).forEach(id=>seenR.add(id));

  });
  const iv=setInterval(()=>{ tick(); timerUI(); cleanReacts(); if(R&&R.phase==='dgallery'&&galleryPage(R)!==galPage) render(R); },200);
  CLEAN.push(unsub,()=>clearInterval(iv),()=>{ mount.onclick=null; });
  mount.onclick=e=>{ const b=e.target.closest('[data-act]'); if(b) act(b.dataset.act); };

  function act(t){ const r=R; if(!r) return; const n=now();
    if(t==='home') return nav({});

    if(t==='results') return upd({phase:'final',revisit:null,phaseAt:n,endsAt:null});

    if(t==='again'){ done=new Set(); const p={phase:'lobby',round:0,qi:-1,ri:-1,queue:null,q:null,lies:null,auto:null,votes:null,options:null,items:null,deltas:null,scored:null,stats:null,
        gallery:null,plist:null,dprompts:null,dpool:null,draws:null,dlikes:null,revisit:null,paused:false,endsAt:null};

  }

  /* ---- engine ---- */
  async function startGame(){ const r=R; if(!r||r.phase!=='lobby') return;
    const count=players(r).filter(([,p])=>p.on!==false).length;
    if(count<r.settings.minPlayers){ toast(`Need at least ${r.settings.minPlayers} players`); return; }
    if(!once('start'+(r.games||0))) return;
    const n=now(), g=(r.games||0)+1, p={phase:'intro',round:1,qi:-1,ri:-1,queue:null,q:null,lies:null,auto:null,votes:null,options:null,items:null,deltas:null,scored:null,stats:null,
      gallery:null,plist:null,dprompts:null,dpool:null,draws:null,dlikes:null,revisit:null,games:g,paused:false,phaseAt:n,endsAt:n+4500};
    for(const id in r.players){ p[`players/${id}/score`]=0; p[`players/${id}/from`]=0; }
    await upd(p); loadPrompts({...r,...p});
  }
  function loadPrompts(r){ const g=r.games, round=r.round, k=Object.values(r.players||{}).filter(p=>p.on!==false).length;
    if(!once('lp'+g+'_'+round)) return;
    getPrompts(r.settings, k*2+12).then(list=>{ if(R&&R.games===g&&R.round===round&&R.phase==='intro') upd({plist:list}); }); }
  function beginDraw(){ const r=R; if(!r.plist||!once('d'+r.games+'_'+r.round)) return;
    const ids=shuffle(players(r).filter(([,p])=>p.on!==false).map(([id])=>id)), list=[...r.plist], prompts={};
    ids.forEach(id=>{ prompts[id]=list.shift()||shuffle(DPROMPTS)[0]; });
    const n=now(), u=LS.get('hg_dused',[]); u.push(...Object.values(prompts)); LS.set('hg_dused',u.slice(-200));
    upd({phase:'draw',dprompts:prompts,dpool:list,draws:null,phaseAt:n,endsAt:n+r.settings.dDrawTime*1000}); }
  function beginRound(){ const r=R; if(!once('br'+r.games+'_'+r.round)) return;
    const D=r.draws||{}, P0=r.dprompts||{};
    const queue=shuffle(Object.entries(D).filter(([id,d])=>d&&!d.empty&&okDrawing(d.img)&&P0[id]&&r.players[id]))
      .map(([id,d])=>({t:'What is this drawing?',a:P0[id],d:shuffle(r.dpool||[]).slice(0,8),author:id,by:nm(r,id),img:d.img,src:'draw'}));
    const n=now();
    if(!queue.length){ toast('Nobody finished a drawing'); return upd({phase:'scores',queue:null,draws:null,phaseAt:n,endsAt:n+5000}); }
    upd({queue,draws:null,ri:-1}).then(()=>beginQuestion(0)); }
  function beginQuestion(i){ const r=R; if(!r.queue||!r.queue[i]||!once('q'+r.games+'_'+r.round+'_'+i)) return;
    const n=now(), q=r.queue[i];
    upd({phase:'lie',qi:(r.qi??-1)+1,ri:i,q,lies:null,auto:null,votes:null,dlikes:null,options:null,items:null,step:0,deltas:null,fakes:null,fk:'none',phaseAt:n,endsAt:n+r.settings.dFakeTime*1000*fam(r)}); }
  function beginVote(){ const r=R; if(!once('v'+r.games+'_'+r.qi)) return;
    const q=r.q, groups=new Map();
    for(const [pid,txt] of Object.entries(r.lies||{})){ const k=norm(txt); if(!k) continue; if(!groups.has(k)) groups.set(k,{text:String(txt).trim(),owners:[]}); groups.get(k).owners.push(pid); }
    const opts=[{id:'truth',text:q.a,truth:true}]; let i=0; for(const g of groups.values()) opts.push({id:'l'+(i++),text:g.text,owners:g.owners});
    const usedN=new Set([norm(q.a),...groups.keys()]); let j=0;
    for(const d of shuffle(q.d||[])){ if(opts.length>=4) break; const k=norm(d); if(usedN.has(k)) continue; usedN.add(k); opts.push({id:'h'+(j++),text:d,house:true}); }
    const n=now(); upd({phase:'vote',options:shuffle(opts),votes:null,phaseAt:n,endsAt:n+r.settings.dVoteTime*1000*fam(r)}); }
  const lieShare=(r,ow,n)=>Math.round(r.settings.dFool*multFor(r)*n*((r.auto||{})[ow]?0.5:1));
  function beginReveal(){ const r=R; if(!once('r'+r.games+'_'+r.qi)) return;
    const st=r.settings, mult=multFor(r), opts=r.options||[], deltas={}, stats=clone(r.stats||{});
    const add=(p,v)=>{ if(r.players[p]&&v) deltas[p]=(deltas[p]||0)+v; };
    const bump=(p,k,v=1)=>{ if(!r.players[p]||!v) return; stats[p]=stats[p]||{}; stats[p][k]=(stats[p][k]||0)+v; };
    for(const o of opts){ const vs=voters(r,o.id);
      if(o.truth){ vs.forEach(p=>{ add(p,st.dTruth*mult); bump(p,'truth'); }); add(r.q.author,st.dArtist*mult*vs.length); bump(r.q.author,'artist',vs.length); continue; }
      vs.forEach(p=>bump(p,'gullible'));
      if(!o.house) (o.owners||[]).forEach(ow=>{ const n=vs.filter(v=>v!==ow).length; add(ow,lieShare(r,ow,n)); bump(ow,'fooled',n); }); }
    const items=opts.filter(o=>!o.truth && voters(r,o.id).length).sort((a,b)=>voters(r,a.id).length-voters(r,b.id).length).map(o=>o.id);
    items.push('truth'); const n=now();
    upd({phase:'reveal',items,step:0,deltas,stats,phaseAt:n,endsAt:n+(items[0]==='truth'?TRUTH_MS:LIE_MS)}); }
  function nextReveal(){ const r=R; if(!once('s'+r.games+'_'+r.qi+'_'+r.step)) return; const n=now();
    if(r.step+1<r.items.length) return upd({step:r.step+1,endsAt:n+(r.items[r.step+1]==='truth'?TRUTH_MS:LIE_MS)});
    finishDrawing(false); }
  function finishDrawing(skipped){ const r=R; if(!once('fd'+r.games+'_'+r.qi)) return; const st=r.settings, n=now(), q=r.q;
    const p={phase:'between',phaseAt:n,endsAt:n+400};
    if(r.scored!==r.qi && q){ const deltas=skipped?{}:Object.assign({},r.deltas||{}), stats=clone(r.stats||{});

      if(likes && st.dLikePoints) deltas[q.author]=(deltas[q.author]||0)+likes*st.dLikePoints;
      if(likes){ stats[q.author]=stats[q.author]||{}; stats[q.author].likes=(stats[q.author].likes||0)+likes; p.stats=stats; }

  function afterBetween(){ const r=R; if(!once('ab'+r.games+'_'+r.qi)) return; const n=now();

    upd({phase:'scores',phaseAt:n,endsAt:n+7000}); }
  function afterScores(){ const r=R; if(!once('as'+r.games+'_'+r.round)) return; const st=r.settings, n=now();
    if(r.round<st.dRounds){ const p={phase:'intro',round:r.round+1,plist:null,dprompts:null,dpool:null,queue:null,draws:null,phaseAt:n,endsAt:n+4500}; upd(p).then(()=>loadPrompts({...r,...p})); return; }

  function tick(){ const r=R; if(!r||r.paused||['lobby','final'].includes(r.phase)) return; const n=now();
    if(r.demo) botTick(r,n);

    else if(r.phase==='draw'){ const ids=Object.keys(r.dprompts||{}).filter(id=>r.players[id]&&r.players[id].on!==false), D=r.draws||{};

    else if(r.phase==='vote'){ const el=eligible(r), V=r.votes||{}; if((el.length&&el.every(id=>V[id])) || n>=r.endsAt) beginReveal(); }
    else if(r.phase==='reveal'){ if(n>=r.endsAt) nextReveal(); }
    else if(r.phase==='between'){ if(n>=r.endsAt) afterBetween(); }
    else if(r.phase==='scores'){ if(n>=r.endsAt) afterScores(); }
    else if(r.phase==='dgallery'){ if(r.endsAt && n>=r.endsAt) upd({phase:'final',phaseAt:n,endsAt:null}); } }
  function botTick(r,n){ const st=r.settings;
    for(const [id,p] of Object.entries(r.players||{})){ if(!p.bot) continue; const k=r.games+'_'+r.round+'_'+r.qi+id, delay=1800+hash(k)%7000;
      if(r.phase==='draw' && (r.dprompts||{})[id] && !(r.draws||{})[id] && n-r.phaseAt>delay && !botMark.has('d'+k)){ botMark.add('d'+k); upd({[`draws/${id}`]:{img:botDoodle(),t:n}}); }
      if(r.phase==='lie' && r.q && r.q.author!==id && !(r.lies||{})[id] && n-r.phaseAt>delay && !botMark.has('l'+k)){ botMark.add('l'+k);
        const taken=new Set(Object.values(r.lies||{}).map(norm)); const pick=shuffle([...(r.q.d||[])]).concat(shuffle(BOT_LIES)).find(c=>!isTruth(c,r.q)&&!taken.has(norm(c)))||'a llama';
        upd({[`lies/${id}`]:pick}); }
      if(r.phase==='vote' && r.q && r.q.author!==id && !(r.votes||{})[id] && n-r.phaseAt>delay*0.6 && !botMark.has('v'+k)){ botMark.add('v'+k);

  /* ---- reactions + confetti ---- */
  function reactions(r){ const rs=r.reactions||{}, n=now();
    for(const [id,x] of Object.entries(rs)){ if(seenR.has(id)) continue; seenR.add(id); if(!x||!REACTS.includes(x.e)||n-(x.t||0)>5000||fx.childElementCount>60) continue; floatEmoji(x.e); } }
  function cleanReacts(){ const r=R, n=now(); if(!r||!r.reactions||n-lastClean<3000) return; lastClean=n;
    const p={}; for(const [id,x] of Object.entries(r.reactions)) if(!x||n-(x.t||0)>6000) p[`reactions/${id}`]=null; if(Object.keys(p).length) upd(p); }
  function floatEmoji(e){ const d=document.createElement('div'); d.className='floater'; d.textContent=e; d.style.left=(6+Math.random()*86)+'%'; d.style.setProperty('--dx',(Math.random()*16-8)+'cqw'); fx.appendChild(d); setTimeout(()=>d.remove(),3200); Sound.sfx('pop'); }
  function confetti(){ for(let i=0;i<70;i++){ const c=document.createElement('i'); c.className='conf'; c.style.left=(Math.random()*100)+'%'; c.style.background=COLORS[i%8]; c.style.animationDelay=(Math.random()*0.6)+'s'; c.style.setProperty('--dx',(Math.random()*20-10)+'cqw'); c.style.setProperty('--r',(Math.random()*720-360)+'deg'); fx.appendChild(c); setTimeout(()=>c.remove(),3600); } }

  /* ---- sound + voice ---- */
  function setMusicFor(r){ musicFor(r,{draw:'think',lie:'think',vote:'think',pick:'think',reveal:'reveal'}); }
  function effects(prev,r){
    const c={p:Object.keys(r.players||{}).length,a:Object.keys(r.draws||{}).length+Object.keys(r.lies||{}).length+Object.keys(r.votes||{}).length};

    if(unlocked) maybeSpeak(r); }
  function maybeSpeak(r){ const s=speechFor(r); if(!s||s[0]===spoken) return; spoken=s[0]; if(s[1]) Voice.say(s[1], r.settings); }
  function speechFor(r){ switch(r.phase){

      case 'intro': return ['i'+r.games+'_'+r.round, multFor(r)>1?'Final round! Everything is worth double!':(r.round===1?"Let's play Doodle Duel! Round one!":`Round ${WORDS[r.round]||r.round}!`)];

  /* ---- rendering ---- */
  function galleryPage(r){ const pics=Object.keys(r.gallery||{}).length, pages=Math.max(1,Math.ceil(pics/8)); return Math.floor(Math.max(0,now()-(r.phaseAt||0))/8000)%pages; }

  function tiles(r, mark, ids){ return `<div class="strip">${players(r).filter(([id])=>!ids||ids.includes(id)).map(([id,p])=>`<div class="tile ${p.on===false||(['lie','vote'].includes(r.phase)&&late(r,p))?'off':''}">${mark(id)?'<span class="chk">✓</span>':''}${avatar(p)}<span class="nm">${esc(p.name)}</span></div>`).join('')}</div>`; }

      case 'vote': body=`<div class="dvote"><div><div class="dframe">${pic(q.img)}</div><div class="dby">${avatar(r.players[q.author])} drawn by ${esc(q.by)}</div></div>
          <div class="dside"><div class="question" style="font-size:2.8cqw;text-align:left">Which one is the real title?</div>
          <div class="dopts">${(r.options||[]).map((o,i)=>`<div class="opt"><b>${'ABCDEFGHIJ'[i]||''}</b>${esc(o.text)}</div>`).join('')}</div>
