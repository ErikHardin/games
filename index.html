  function afterScores(){ const r=R; if(!once('as'+r.games+'_'+r.round)) return; const st=r.settings, n=now();
    if(r.round<st.mRounds) return upd({phase:'intro',round:r.round+1,micQ:singersFor(r),mi:-1,song:null,stopAt:null,mvotes:null,mres:null,phaseAt:n,endsAt:n+4500});
    upd({phase:'final',phaseAt:n,endsAt:null}); }
  function tick(){ const r=R; if(!r||r.paused||['lobby','final'].includes(r.phase)) return; const n=now();
    if(r.demo) botTick(r,n);
    if(r.phase==='intro'){ if(n>=r.endsAt) beginPick(0); }
    else if(r.phase==='pick'){ if(r.song && okVid(r.song.id)) beginSing(); else if(n>=r.endsAt){ toast(`${nm(r,singer(r))} ran out of time`); nextSinger(); } }
    else if(r.phase==='stop'){ if(n>=r.endsAt) beginJudge(); }
    else if(r.phase==='judge'){ const J=judges(r), V=r.mvotes||{}; if((J.length&&J.every(id=>V[id]))||n>=r.endsAt) beginResult(); }
    else if(r.phase==='result'){ if(n>=r.endsAt) nextSinger(); }
    else if(r.phase==='scores'){ if(n>=r.endsAt) afterScores(); } }
  function botTick(r,n){ for(const [id,p] of Object.entries(r.players||{})){ if(!p.bot) continue; const k=r.games+'_'+r.round+'_'+r.mi+id, d=1500+hash(k)%6000;
      if(r.phase==='judge' && !(r.mvotes||{})[id] && n-r.phaseAt>d && !botMark.has('j'+k)){ botMark.add('j'+k); const x=Math.random(); upd({[`mvotes/${id}`]:x<0.5?'n':x<0.8?'c':'m'}); }
      if(r.phase==='sing' && r.settings.reactions!==false && Math.random()<0.012) upd({[`reactions/${uid()}`]:{e:REACTS[Math.floor(Math.random()*REACTS.length)],t:n,p:id}}); } }

  /* ---- reactions (also fill the applause meter) ---- */
  function reactions(r){ const rs=r.reactions||{}, n=now(); let got=false;
    for(const [id,x] of Object.entries(rs)){ if(seenR.has(id)) continue; seenR.add(id); if(!x||!REACTS.includes(x.e)||n-(x.t||0)>5000) continue;
      if(['sing','stop','judge'].includes(r.phase) && x.p!==singer(r)){ applause++; got=true; }
      if(fx.childElementCount<=60) floatEmoji(x.e); } return got; }
  function cleanReacts(){ const r=R, n=now(); if(!r||!r.reactions||n-lastClean<3000) return; lastClean=n;
    const p={}; for(const [id,x] of Object.entries(r.reactions)) if(!x||n-(x.t||0)>6000) p[`reactions/${id}`]=null; if(Object.keys(p).length) upd(p); }
  function floatEmoji(e){ const d=document.createElement('div'); d.className='floater'; d.textContent=e; d.style.left=(6+Math.random()*86)+'%'; d.style.setProperty('--dx',(Math.random()*16-8)+'cqw'); fx.appendChild(d); setTimeout(()=>d.remove(),3200); if(!['sing','judge'].includes(R&&R.phase)) Sound.sfx('pop'); }
  function confetti(){ for(let i=0;i<70;i++){ const c=document.createElement('i'); c.className='conf'; c.style.left=(Math.random()*100)+'%'; c.style.background=COLORS[i%8]; c.style.animationDelay=(Math.random()*0.6)+'s'; c.style.setProperty('--dx',(Math.random()*20-10)+'cqw'); c.style.setProperty('--r',(Math.random()*720-360)+'deg'); fx.appendChild(c); setTimeout(()=>c.remove(),3600); } }

  /* ---- sound + voice (game music stays off while a song plays) ---- */
  function setMusicFor(r){ musicFor(r,{sing:'off',stop:'off',judge:'off',pick:'lobby'}); }
  function effects(prev,r){
    const c={p:Object.keys(r.players||{}).length,v:Object.keys(r.mvotes||{}).length};
    if(lastCounts && unlocked){ if(c.p>lastCounts.p) Sound.sfx('join'); if(c.v>lastCounts.v) Sound.sfx('lock'); } lastCounts=c;
    if(prev && prev.phase!==r.phase){ setMusicFor(r);
      if(r.phase==='intro') Sound.sfx('start');
      if(r.phase==='stop') Sound.sfx('buzz');
      if(r.phase==='result'){ Sound.sfx(r.mres&&r.mres.drop?'fanfare':'points'); if(r.mres&&r.mres.drop) confetti(); }
      if(r.phase==='scores') Sound.sfx('points');
      if(r.phase==='final'){ Sound.sfx('fanfare'); confetti(); setTimeout(confetti,1000); } }
    if(r.phase==='intro'||r.phase==='result'){ const nx=(r.micQ||[])[r.phase==='intro'?0:r.mi+1]; if(nx) Voice.prefetch(`${nm(r,nx)}, pick your song!`, r.settings); }
    if(unlocked) maybeSpeak(r); }
  function maybeSpeak(r){ const s=speechFor(r); if(!s||s[0]===spoken) return; spoken=s[0]; if(s[1]) Voice.say(s[1], r.settings); }
  function speechFor(r){ switch(r.phase){
      case 'lobby': return ['lobby'+r.games, r.games?'':'Welcome to Hardin Games! Grab your phones and join with the code on the screen.'];
      case 'intro': return ['i'+r.games+'_'+r.round, multFor(r)>1?'Final round! Everything is worth double!':(r.round===1?"Let's play Mic Drop! Round one!":`Round ${WORDS[r.round]||r.round}!`)];
      case 'pick': return ['p'+r.games+'_'+r.round+'_'+r.mi, `${nm(r,singer(r))}, pick your song!`];
      case 'stop': return ['s'+r.games+'_'+r.round+'_'+r.mi, 'Finish the line!'];
      case 'result': return ['r'+r.games+'_'+r.round+'_'+r.mi, r.mres&&r.mres.drop?'Mic drop!':''];
      case 'final': { const top=players(r).sort((a,b)=>(b[1].score||0)-(a[1].score||0))[0]; return ['f'+r.games, top?`And the winner is… ${top[1].name}!`:'']; }
    } return null; }

  /* ---- rendering ---- */
  function timerUI(){ const r=R, el=$('.timer',stage); if(!r||!el) return; const left=r.paused?(r.remaining||0):Math.max(0,(r.endsAt||0)-now()), s=Math.ceil(left/1000);
    if(el.textContent!==String(s)) el.textContent=s; el.classList.toggle('low',s<=5&&!r.paused);
    if(s<=5 && s>0 && s!==lastTick && !r.paused && unlocked && !['sing','judge'].includes(r.phase)) Sound.sfx('tick'); lastTick=s; }
  function top(r){ const n=(r.micQ||[]).length, lbl=['lobby','final'].includes(r.phase)?'':`ROUND ${r.round}${multFor(r)>1?' · DOUBLE POINTS':''}${r.mi>=0&&n&&['pick','sing','stop','judge','result'].includes(r.phase)?` · SINGER ${r.mi+1} OF ${n}`:''}`;
    return `<div class="tvtop"><span><b>HARDIN GAMES</b> · MIC DROP</span><span>${lbl}</span><span>CODE <b>${esc(r.code)}</b></span></div>`; }
  function ctl(r){ if(['lobby','final'].includes(r.phase)) return '';
    return `<div class="hostctl"><button class="alt" data-act="${r.paused?'resume':'pause'}">${r.paused?'Resume':'Pause'}</button>${r.phase==='sing'&&!dark&&!forceCover?'<button class="pink" data-act="stopnow">🛑 Stop now!</button>':''}<button class="alt" data-act="skip">${['pick','sing'].includes(r.phase)?'Skip song':'Skip'}</button></div>`; }
  function render(r){ const st=r.settings, sid=singer(r), sp=r.players&&r.players[sid]; let body='', cls='';
    const phase=(forceCover&&r.phase==='sing')?'stop':r.phase;
    switch(phase){
      case 'lobby': { const url=joinUrl(r.code), ps=players(r), max=st.maxPlayers;
        const tl=ps.map(([id,p])=>`<div class="tile ${p.on===false?'off':''}">${avatar(p)}<span class="nm">${esc(p.name)}${p.bot?' 🤖':''}${r.vip===id?' ⭐':''}</span></div>`).join('')+
          Array.from({length:Math.max(0,Math.min(8,max)-ps.length)},()=>'<div class="tile empty">open</div>').join('');
        body=`<div class="lobby"><div><div class="logo">HARDIN<span>GAMES</span></div><div class="gname" style="color:var(--gmMic)">MIC DROP</div>
          <div class="codebox">${url?'<div class="qr" id="qr"></div>':''}<div><div class="lbl">JOIN ON YOUR PHONE WITH CODE</div><div class="code">${esc(r.code)}</div>${url?`<div class="url">${esc(url.replace(/^https?:\/\//,''))}</div>`:''}</div></div></div>
          <div style="display:flex;flex-direction:column;gap:2cqw"><div class="tiles">${tl}</div>
          <div class="note">${ps.length}/${max} players${st.audience==='family'?' · Family mode':''}${voiceTag(st)}</div>
          <div class="tvbtns"><button data-act="start" ${ps.length<st.minPlayers?'disabled':''}>Everybody's in — start!</button></div></div></div>`; break; }
      case 'intro': body=`<div class="center"><div class="bigintro">${multFor(r)>1?'FINAL ROUND':'ROUND '+r.round}</div><div class="subintro">${multFor(r)>1?'Everything is worth double!':'Warm up those vocal cords'}</div></div>`; break;
      case 'pick': { const nx=(r.micQ||[]).slice(r.mi+1,r.mi+4).map(id=>r.players[id]).filter(Boolean);
        body=`<div class="center">${sp?`<div class="bigav">${avatar(sp)}</div>`:''}<div class="bigintro" style="font-size:4.2cqw">${esc(nm(r,sid)).toUpperCase()}, PICK YOUR SONG!</div><div class="note">Search for a karaoke version on your phone</div>
          ${nx.length?`<div class="upnext">Up next ${nx.map(p=>`<span class="vchip">${avatar(p)}${esc(p.name)}</span>`).join('')}</div>`:''}</div><div class="timer"></div>`; break; }
      case 'sing': case 'judge': { cls='mic-live'; const J=judges(r), V=r.mvotes||{};
        const meter=`<div class="meter">APPLAUSE<div class="m"><i style="width:${Math.min(100,applause*5)}%"></i></div></div>`;
        body=`<div class="singer">${sp?avatar(sp):''}<div><div style="font-family:Bungee;color:var(--gold)">${esc(nm(r,sid)).toUpperCase()}</div><div class="small muted" style="font-size:1.4cqw">${esc((r.song&&r.song.title)||'')}${r.phase==='sing'?' · it could stop any second…':''}${hr.on&&r.phase==='sing'?(micLiveH(r)?' · 🔴 mic live':' · 🎙️ phone mic ready'):''}</div></div></div>
          ${r.phase==='judge'?`<div class="judgebar"><b>Did ${esc(nm(r,sid))} nail it?</b> Vote on your phone ${J.map(id=>`<span class="jv ${V[id]?'on':''}">${avatar(r.players[id])}</span>`).join('')}</div><div class="timer"></div>`:meter}
          ${r.phase==='sing'&&dark?`<div class="darkcover"><div class="em">🙈</div><div class="big">LYRICS OFF!</div><div class="sub">${esc(nm(r,sid))}, keep singing…</div></div>`:''}
          ${r.phase==='sing'&&needPlay&&!dark?'<div class="needplay"><button data-act="ytplay">▶ Tap to play the video</button></div>':''}`; break; }
      case 'stop': body=`<div class="cover"><div class="big">FINISH THE LINE!</div>${sp?`<div class="bigav">${avatar(sp)}</div>`:''}<div class="sub">${esc(nm(r,sid))}, keep singing!</div>${hr.on&&micLiveH(r)?'<div class="sub">🔴 Mic is live</div>':''}${r.phase==='stop'?'<div class="timer"></div>':''}</div>`; cls='mic-stop'; break;
      case 'result': { const m=r.mres||{counts:{}};
        body=`<div class="center">${sp?`<div class="bigav">${avatar(sp)}</div>`:''}${m.drop?'<div class="bigintro">🎤 MIC DROP!</div>':`<div class="bigintro" style="font-size:5cqw">${esc(nm(r,sid)).toUpperCase()}</div>`}

          <div class="bigintro" style="font-size:6cqw;color:var(--good)">+${m.pts||0}</div></div>`; break; }
      case 'scores': { const rows=players(r).sort((a,b)=>(b[1].score||0)-(a[1].score||0));
        body=`<div class="center"><div class="subintro">AFTER ROUND ${r.round}</div><div class="bigintro" style="font-size:4.5cqw">SCORES</div>

      case 'final': { const rows=players(r).sort((a,b)=>(b[1].score||0)-(a[1].score||0)), pod=[rows[1],rows[0],rows[2]], aw=mAwards(r);
        body=`<div class="center final"><div class="bigintro" style="font-size:4.2cqw">${rows[0]?esc(rows[0][1].name)+' WINS!':'GAME OVER'}</div>

          ${aw.length?`<div class="awards">${aw.map(a=>`<div class="award"><div class="ai">${a.icon}</div><div class="at">${a.title}</div><div class="an">${esc(a.names)}</div><div class="ad">${esc(a.detail)}</div></div>`).join('')}</div>`:''}
          <div class="tvbtns"><button data-act="again">Play again</button><button class="alt" data-act="home">Exit</button></div></div>`; break; }

    stage.className='stage '+cls;

  }

/* ---- Admin lock: 4-digit PIN checked by the Worker (ADMIN_PIN secret) ---- */
async function adminCheck(body){
  const r=await fetch(CONFIG.WORKER_URL.replace(/\/$/,'')+'/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let j={}; try{ j=await r.json(); }catch(e){} return {ok:r.ok&&j.ok, open:!!j.open, token:j.token, error:j.error||('HTTP '+r.status), status:r.status};
}
async function Admin(){
  if(!CONFIG.WORKER_URL) return AdminPanel(false);
  app.innerHTML=`<div class="admin"><div class="logo">HARDIN<span>GAMES</span></div><div class="muted" style="text-align:center">Checking…</div></div>`;
  const tok=LS.get('hg_admin_token','');
  let res; try{ res=await adminCheck(tok?{token:tok}:{}); }catch(e){ return AdminOffline(); }
  if(!PARAMS.has('admin')) return;
  if(res.open) return AdminPanel(false);
  if(res.ok) return AdminPanel(true);
  LS.set('hg_admin_token',''); PinPad();
}

function PinPad(){
  let code='', busy=false;
  app.innerHTML=`<div class="admin"><div class="logo">HARDIN<span>GAMES</span></div>
    <div class="sec pinsec"><h3>Admin code</h3><div class="pindots">${'<i></i>'.repeat(4)}</div><div class="pinmsg muted small">&nbsp;</div>
    <div class="pinpad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button class="alt" data-k="${k}">${k}</button>`).join('')}</div>
    <a class="pinhome" data-home>Back to games</a></div></div>`;
  const dots=[...app.querySelectorAll('.pindots i')], msgEl=$('.pinmsg',app), sec=$('.pinsec',app);
  const show=()=>dots.forEach((d,i)=>d.classList.toggle('on',i<code.length));
  const press=async k=>{ if(busy) return;
    if(k==='⌫'){ code=code.slice(0,-1); return show(); }
    if(code.length>=4) return; code+=k; show(); if(code.length<4) return;
    busy=true; msgEl.textContent='Checking…';
    let res; try{ res=await adminCheck({pin:code}); }catch(e){ res={ok:false,error:"Can't reach the lock — try again"}; }
    if(res.ok){ LS.set('hg_admin_token',res.token||''); return AdminPanel(!res.open); }
    msgEl.textContent=res.status===401?'Wrong code':res.error; sec.classList.remove('shake'); void sec.offsetWidth; sec.classList.add('shake');
    try{ navigator.vibrate&&navigator.vibrate(120); }catch(e){} code=''; show(); busy=false; };
  app.onclick=e=>{ if(e.target.closest('[data-home]')) return nav({}); const b=e.target.closest('[data-k]'); if(b) press(b.dataset.k); };
  const kb=e=>{ if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==='Backspace') press('⌫'); };
  document.addEventListener('keydown',kb); CLEAN.push(()=>{ app.onclick=null; document.removeEventListener('keydown',kb); });
}

      <div class="fld"><label>AI topic</label><input data-k="aiTopic" placeholder="Random" value="${esc(st.aiTopic)}" style="width:55%"></div>
      <button class="alt" id="testai">Test an AI question</button><div id="aiout" class="small muted"></div>
      <h4>Family pack</h4><div class="qlist">${Object.entries(fam).map(([id,q])=>`<div class="qitem"><div>${showQ(q.t)}<br><span class="ok small">${esc(q.a)}</span>${q.safe===false?' <span class="small muted">· adults only</span>':''}</div><button class="alt" data-del="${id}">Delete</button></div>`).join('')||'<div class="muted small">No family questions yet.</div>'}</div>
      <textarea id="ft" rows="2" placeholder="Grandpa's first car was a ___"></textarea><input id="fa" placeholder="Real answer"><div class="row"><input id="fd1" placeholder="Fake answer (optional)"><input id="fd2" placeholder="Fake answer (optional)"></div>
      <div class="fld"><label>OK for kids</label><input type="checkbox" id="fsafe" checked></div><button id="fadd">Add to family pack</button>`)}
    ${sec('trivia','🧠 Smarty Pants',`${num('tRounds','Rounds',1,6)}${num('tPerRound','Questions per round',2,10)}${num('tTime','Seconds to answer',8,60)}${num('tVoteTime','Seconds to vote on a category',5,40)}
      ${chk('tNumbers','One "closest number" question per round')}${chk('tWager','Final wager question')}${num('tStreak','Streak bonus (3+ right in a row)',0,1000,50)}${chk('tAI','AI writes the questions')}
      <div class="fld"><label>Your own categories</label><input data-k="tCats" placeholder="e.g. Our Family, 2000s Music" value="${esc(st.tCats)}" style="width:55%"></div>
      <div class="small muted">Flagged questions won't come back${Object.keys(flags).length?'':': none yet'}</div>
      <div class="qlist">${Object.entries(flags).map(([id,f])=>`<div class="qitem"><div>${esc(f.q)}<br><span class="ok small">${esc(f.a)}</span></div><button class="alt" data-unflag="${esc(id)}">Unflag</button></div>`).join('')}</div>`)}
    ${sec('mic','🎤 Mic Drop',`${num('mRounds','Rounds',1,4)}${num('mStopMin','Earliest the lyrics go dark (seconds into the song)',20,240,5)}${num('mStopMax','Latest the lyrics go dark (seconds into the song)',20,300,5)}
      ${num('mDark','Lyrics go dark before the stop (seconds, 0 = off)',0,20)}${num('mFinishTime','Seconds to finish the line',5,30)}${num('mJudgeTime','Seconds to judge',8,40)}${num('mPickTime','Seconds to pick a song',20,180,5)}
      <h4>Scoring</h4>${num('mNailed','Points for "Nailed it"',0,5000,50)}${num('mClose','Points for "Close"',0,5000,50)}${num('mApplause','Max applause bonus',0,2000,50)}${num('mMult','Last round multiplier',1,5)}
      <h4>Phones</h4>${chk('mPhoneVideo','Lyrics video on the judges\' phones')}${sel('mMic','Singer\'s phone as the mic',[['stop','On when the music stops'],['all','On for the whole song'],['off','Off']])}
      <h4>Songs</h4>${chk('mAI','"Surprise me" button (AI picks a song)')}<div class="small muted">Song search needs YOUTUBE_API_KEY in Cloudflare. Pasting a YouTube link always works.</div>`)}
    ${sec('doodle','🎨 Doodle Duel',`${num('dRounds','Rounds',1,4)}${num('dDrawTime','Seconds to draw',20,180,5)}${num('dFakeTime','Seconds to write a fake title',15,120,5)}${num('dVoteTime','Seconds to vote',10,90,5)}
      <h4>Scoring</h4>${num('dTruth','Points for spotting the real title',0,5000,50)}${num('dFool','Points per player fooled',0,5000,50)}${num('dArtist','Artist bonus per player who gets it',0,5000,50)}${num('dMult','Last round multiplier',1,5)}
      <h4>Extras</h4>${chk('dLieForMe','"Lie for me" button (half points)')}${chk('dLikes','Players can 👍 drawings')}${num('dLikePoints','Points per 👍',0,1000,25)}${chk('dGallery','Show the gallery at the end')}
      <h4>Prompts</h4>${chk('dAI','AI writes drawing prompts')}<label class="small muted">Your own prompts (one per line)</label><textarea data-k="dPrompts" rows="4" placeholder="Dad's famous chili&#10;Grandma's dance moves">${esc(st.dPrompts)}</textarea>`)}
    <button id="save">Save settings</button></div>`;
    $('#back').onclick=()=>nav({});
    const ts=app.querySelector('[data-k=theme]'); if(ts) ts.onchange=()=>applyTheme(ts.value);
    app.querySelectorAll('[data-k=voice],[data-k=readAloud]').forEach(i=>i.onchange=()=>save(i.dataset.k==='voice'?(i.value==='clone'?'Saved ✓ Games will use your voice':'Saved ✓ Games will use the built-in voice'):'Saved ✓'));
    app.querySelectorAll('details.sec').forEach(d=>d.addEventListener('toggle',()=>{ d.open?openS.add(d.dataset.sec):openS.delete(d.dataset.sec); LS.set('hg_admin_open',[...openS]); }));
    if($('#lockb')) $('#lockb').onclick=()=>{ LS.set('hg_admin_token',''); toast('Admin locked'); nav({}); };
    $('#save').onclick=save;
    $('#testv').onclick=async()=>{ collect(); Sound.init(st); Voice.unlock(); const o=$('#vout');
      o.textContent=st.voice==='clone'?'Calling your cloned voice…':'Speaking…';
      const lines=['Welcome to Hardin Games!','Grab your phones, it is game time!','Who is ready to play?','Let the games begin!'], tm=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
      const res=await Voice.say(`${lines[Math.floor(Math.random()*lines.length)]} Testing at ${tm}.`,{...st,readAloud:true},{quiet:true});
      o.innerHTML=res.error?`<span class="err">Cloned voice failed: ${esc(res.error)}</span> · used the built-in voice`:(res.mode==='clone'?'<span class="ok">✓ Played in your cloned voice</span>':'<span class="ok">✓ Played the built-in voice</span>'); };
    $('#testai').onclick=async()=>{ collect(); $('#aiout').textContent='Thinking…'; try{ const [q]=await fetchAI(st,1); $('#aiout').innerHTML=q?`${showQ(q.t)}<br><span class="ok">${esc(q.a)}</span> · fakes: ${esc((q.d||[]).join(', '))}`:'No question returned'; }catch(e){ $('#aiout').textContent='AI not available: '+e.message; } };
    $('#fadd').onclick=async()=>{ const t=fixBlank($('#ft').value), a=$('#fa').value.trim(); if(!t) return toast('Put ___ where the answer goes'); if(!a) return toast('Add the answer');
      const id=uid(); fam[id]={t,a,d:[$('#fd1').value.trim(),$('#fd2').value.trim()].filter(Boolean),safe:$('#fsafe').checked}; await S.store.set(`${ROOT}/packs/family/${id}`,fam[id]); collect(); draw(); toast('Added'); };
    app.querySelectorAll('[data-unflag]').forEach(b=>b.onclick=async()=>{ const id=b.dataset.unflag; delete flags[id]; await S.store.remove(`${ROOT}/trivia/flagged/${id}`); collect(); draw(); });
    app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ const id=b.dataset.del; delete fam[id]; await S.store.remove(`${ROOT}/packs/family/${id}`); collect(); draw(); });
  };
  function collect(){ app.querySelectorAll('[data-k]').forEach(i=>{ const k=i.dataset.k; st[k]= i.type==='checkbox'?i.checked : (i.type==='number'||i.type==='range')?Number(i.value) : i.value; });
    app.querySelectorAll('[data-pack]').forEach(i=>st.packs[i.dataset.pack]=i.checked);
    if(st.maxPlayers<st.minPlayers) st.maxPlayers=st.minPlayers;
    if(st.mStopMax<st.mStopMin) st.mStopMax=st.mStopMin; }
  async function save(okMsg){ collect();
    try{ await S.store.set(`${ROOT}/settings`,st); const back=(await S.store.get(`${ROOT}/settings`))||{};
      if(back.voice!==st.voice||back.readAloud!==st.readAloud) throw new Error("the database didn't keep it");
      toast(typeof okMsg==='string'?okMsg:'Saved ✓'); return true; }
    catch(e){ toast("Couldn't save: "+(e.message||e)); return false; } }
  draw();
  try{ speechSynthesis.onvoiceschanged=()=>{ if(PARAMS.has('admin')){ collect(); draw(); } }; CLEAN.push(()=>speechSynthesis.onvoiceschanged=null); }catch(e){}
}

route();
</script>
</body>
</html>
